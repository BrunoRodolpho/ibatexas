# Journeys nightly (T1b-4) — the certification suite against a REAL ephemeral
# test stack, LLM-driven end to end.
#
# What it runs: `ibx journey run --suite --nightly` — every active journey,
# pass^k with k=4 on the money flows (JOURNEY-001 place+cancel) and k=1 on
# exploratory journeys, dollar abort at $50 (plan §7), retry-once flake
# policy (yellow), flake-ledger quarantine, and `gh issue create` for RED
# runs (assignable owner from the ledger).
#
# SECRETS — read this before touching the workflow:
#   * ANTHROPIC_API_KEY comes from the `journeys-nightly` repo ENVIRONMENT
#     secret and MUST be a DEDICATED, SPEND-CAPPED key (Anthropic console →
#     workspace with a hard monthly budget). Never the production key, never
#     a personal key: the workflow's own cap ($50/night via --budget-usd) is
#     the second line of defense, the provider-side spend cap is the first.
#   * Everything else (JWT_SECRET, AUDIT_REDACT_SECRET, DB/Redis passwords,
#     IBX_TEST_FINGERPRINT, ...) is GENERATED PER RUN by
#     scripts/gen-env-test.sh — no other repo secret exists or is needed,
#     and nothing secret survives the run (GH-hosted runner = VM destroyed).
#
# Money-flow cadence (D-014): the order-cancel route is rate-limited
# 5/10min/customer, which caps same-stack JOURNEY-001 attempts at 4 per
# window — exactly k=4. The single nightly retry therefore waits
# --retry-delay-seconds 600 so it starts in a fresh rate-limit window.
#
# Flake policy WITH OWNERSHIP (packages/journeys/governance/flake-ledger.json):
#   * retry-once = YELLOW (journey passes the night; flaky night recorded);
#   * 2 consecutive flaky nights = QUARANTINED (skipped + coverage cells
#     reported `waived-quarantined`); the updated ledger is committed back
#     to the default branch by this workflow;
#   * de-quarantine is MANUAL: `ibx journey run <id> --k 2 --json` green
#     twice, then `ibx journey flake --dequarantine <id>` (commit the diff);
#   * HARD failure (red) files a GH issue with the ledger's owner assigned.
#
# Verify (after push): gh workflow run journeys-nightly && gh run watch
#   $(gh run list --workflow journeys-nightly -L1 --json databaseId
#   -q '.[0].databaseId') --exit-status
# (push-dependent items: docs/agents/phase-1b-pending-push.md)

name: journeys-nightly

on:
  schedule:
    # 08:00 UTC = 03:00 America/Chicago during CDT (02:00 during CST — GH
    # cron is UTC-only; the winter hour drift is accepted and recorded).
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write # flake-ledger commit-back (quarantine state must persist)
  issues: write # `gh issue create` on RED runs / new quarantines

concurrency:
  group: journeys-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The repo environment holding the dedicated SPEND-CAPPED key (see
    # header). Create it once: Settings → Environments → journeys-nightly →
    # secret ANTHROPIC_API_KEY.
    environment: journeys-nightly
    env:
      IBX_TEST_COMPOSE_PROJECT: ibx-test-${{ github.run_id }}
      PROCESS_COMPOSE_VERSION: v1.103.0
      # sha256 of process-compose_linux_amd64.tar.gz for the pinned version.
      PROCESS_COMPOSE_SHA256: 79f79f4efcb26b7abb29d5ce7aa2b9807afa1333b1ef1c5dee607b12fbc0ba89
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@5b4374b04084dc1f9032b52464284b769ac5059e # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ibatexas/domain db:generate

      # The CLI + its workspace dependency closure (includes @ibatexas/journeys
      # and the packs). The api/commerce apps boot from source via the
      # process-compose test profile (tsx watch / medusa develop) — no app
      # build; the profile's build-packages step rebuilds types/tools itself.
      - name: Build the CLI + workspace deps
        run: pnpm --filter "@ibatexas/cli..." build

      # test-stack-up.sh requires `ibx` on PATH (dist has the node shebang).
      - name: Put ibx on PATH
        run: |
          chmod +x packages/cli/dist/index.js
          sudo ln -sf "$PWD/packages/cli/dist/index.js" /usr/local/bin/ibx
          ibx --version

      - name: Install process-compose (pinned + checksum-verified)
        run: |
          curl -fsSL -o /tmp/pc.tar.gz "https://github.com/F1bonacc1/process-compose/releases/download/${PROCESS_COMPOSE_VERSION}/process-compose_linux_amd64.tar.gz"
          echo "${PROCESS_COMPOSE_SHA256}  /tmp/pc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pc.tar.gz -C /tmp process-compose
          sudo mv /tmp/process-compose /usr/local/bin/process-compose
          process-compose version

      # gen-env-test.sh generates EVERY secret per run (JWTs, DB/Redis
      # passwords, AUDIT_REDACT_SECRET, the IBX_TEST_FINGERPRINT, ...) and
      # interpolates ANTHROPIC_API_KEY from a developer-style .env — which we
      # synthesize here from the environment secret. Values are never printed.
      - name: Generate .env.test (per-run secrets + spend-capped key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY environment secret is missing — configure the journeys-nightly repo environment (must be a DEDICATED SPEND-CAPPED key)" >&2
            exit 1
          fi
          umask 177
          printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" > .env
          ./scripts/gen-env-test.sh

      # The canonical launcher (T1a-11b): infra compose up --wait → ibx db
      # provision + bootstrap (+ oracle/sim roles + sim migrate) →
      # process-compose test profile (api :3001 + commerce :9000) →
      # ibx db reindex + ibx test seed.
      - name: Test stack up (infra + migrate + apps + seed)
        run: ./scripts/test-stack-up.sh

      # ── THE suite (T1b-4 nightly contract) ──────────────────────────────
      # k=4 money flows (JOURNEY-001 — the place+cancel money path), k=1
      # exploratory; $50 dollar abort (plan §7); retry-once with the 600s
      # rate-limit spacing; --nightly is the ONLY mode that touches the
      # flake ledger. continue-on-error so artifacts/issues/teardown always
      # run — the "Propagate suite result" step re-fails the job.
      - name: Run the nightly journey suite
        id: suite
        continue-on-error: true
        run: |
          mkdir -p artifacts
          ibx journey run --suite --nightly \
            --k 1 --k-money 4 --money-flows JOURNEY-001 \
            --budget-usd 50 --retry-delay-seconds 600 \
            --json > artifacts/nightly-suite.json

      # Coverage views with quarantine folded in (the T1a-3 seam): cells
      # owned by quarantined journeys are reported `waived-quarantined`.
      - name: Coverage matrix artifact (quarantine-aware)
        if: always()
        run: |
          QUARANTINED="$(ibx journey flake --list-quarantined)"
          if [ -n "$QUARANTINED" ]; then
            ibx journey coverage --out artifacts/coverage --quarantined "$QUARANTINED"
          else
            ibx journey coverage --out artifacts/coverage
          fi

      # sim_runs / sim_results export (T1b-5 persistent run records, joined
      # to intent_audit via the hashed sessionId namespaces) — SQL-to-JSON
      # through the compose postgres, no pg_dump restore dance needed.
      - name: Export sim_runs / sim_results
        if: always()
        run: |
          for table in sim_runs sim_results; do
            docker compose --env-file .env.test -f docker-compose.test.yml \
              -p "$IBX_TEST_COMPOSE_PROJECT" exec -T postgres \
              psql -U ibatexas -d ibatexas_test -Atc \
              "SELECT COALESCE(json_agg(row_to_json(t)), '[]'::json) FROM $table t" \
              > "artifacts/$table.json" || echo "::warning::$table export failed"
          done

      # RED runs / new quarantines file issues with the assignable owner from
      # the flake ledger (the nightly report carries ready-made payloads).
      - name: File issues for RED runs (gh issue create)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f artifacts/nightly-suite.json ]; then
            gh issue create \
              --title "[journeys-nightly] $(date -u +%F): suite crashed before producing a report" \
              --body "The nightly suite step produced no artifacts/nightly-suite.json — inspect the workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
            exit 0
          fi
          jq -c '.issues[]?' artifacts/nightly-suite.json | while IFS= read -r issue; do
            title="$(jq -r '.title' <<<"$issue")"
            body="$(jq -r '.body' <<<"$issue")"
            owner="$(jq -r '.owner' <<<"$issue")"
            if [ -n "$owner" ]; then
              gh issue create --title "$title" --body "$body" --assignee "$owner" ||
                gh issue create --title "$title" --body "$body (owner @$owner not assignable)"
            else
              gh issue create --title "$title" --body "$body"
            fi
          done

      # Quarantine state must survive the ephemeral runner: commit the ledger
      # diff back (schedule runs execute on the default branch). Yellow
      # streaks and quarantines are the ONLY thing this workflow ever writes
      # to the repo.
      - name: Commit flake-ledger updates back
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain packages/journeys/governance/flake-ledger.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/journeys/governance/flake-ledger.json
            git commit -m "journeys-nightly: flake ledger update ($(date -u +%F))"
            git push
          else
            echo "flake ledger untouched — nothing to commit"
          fi

      - name: Upload artifacts (traces + coverage + sim export)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: journeys-nightly-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/
            runs/
            /tmp/ibx-test-events.jsonl

      # GH-hosted runner teardown is VM destruction — this step is the
      # RECORDED self-hosted safety (plan §5 T1b-4): if this workflow ever
      # moves to a self-hosted runner, these two lines are the guarantee
      # that no container, volume or app process survives the run.
      - name: Tear down the test stack
        if: always()
        run: ./scripts/test-stack-down.sh || true
      - name: Compose down (self-hosted safety — keep even on GH-hosted)
        if: always()
        run: docker compose -f docker-compose.test.yml -p "$IBX_TEST_COMPOSE_PROJECT" down -v --remove-orphans

      - name: Propagate suite result
        if: steps.suite.outcome != 'success'
        run: |
          echo "::error::nightly journey suite RED — see artifacts/nightly-suite.json in the run artifacts"
          exit 1
