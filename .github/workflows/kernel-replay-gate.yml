# Kernel replay gate (T1b-3) — PR check over policy/guard-touching changes.
#
# What it proves: the committed golden replay vectors
# (packages/cli/governance/replay-golden-vectors.json) still reproduce their
# decisions under the CURRENT policy packs, via the REAL replay machinery —
# Postgres write (canonical 25-column INSERT) → readAuditWindow → rowToRecord
# → adjudicate() per record → drift classification. A policy/guard change
# that alters any decision fails this check with exit 2; after an INTENDED
# change, run `ibx kernel replay --update-golden
# packages/cli/governance/replay-golden-vectors.json` and commit the diff.
#
# Why a live database: `ibx kernel replay` replays the `intent_audit` table
# (audit-postgres), not file fixtures — so the gate boots the repo's
# infra-only test compose (postgres service only), applies the audit schema,
# seeds the golden vectors (`--seed-file`, which also ensures the
# current-month partition) and replays the window in `--ci` mode. `--ci` is
# fail-closed: a disabled IBX_AUDIT_POSTGRES_ENABLED flag or an empty window
# is a hard failure (vacuous-gate protection, plan risk #7) — this job can
# never go green without scanning real records.
#
# Zero LLM tokens: adjudication is pure policy code; no ANTHROPIC_* secret is
# (or may ever be) configured here.
#
# Exit codes (replayExitCode in packages/cli/src/commands/kernel.ts):
#   0 clean / 1 errors or vacuous gate / 2 drift detected.

name: Kernel replay gate

on:
  pull_request:
    paths:
      # Policy/guard surfaces — any of these can change adjudication outcomes.
      - "packages/pack-*/src/**"
      - "apps/api/src/claustrum/**"
      - "packages/packs-composed/**"
      # The gate's own moving parts.
      - "packages/cli/governance/replay-golden-vectors.json"
      - "packages/cli/src/commands/kernel.ts"
      - ".github/workflows/kernel-replay-gate.yml"

permissions:
  contents: read

concurrency:
  group: kernel-replay-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The compose file's IBX_TEST_* defaults: pgvector/pgvector:pg17 on
      # 127.0.0.1:5434, user ibatexas / db ibatexas_test (docker-compose.test.yml).
      DATABASE_URL: postgres://ibatexas:ibatexas-test@127.0.0.1:5434/ibatexas_test
      IBX_AUDIT_POSTGRES_ENABLED: "true"
      COMPOSE_PROJECT: ibx-replay-gate-${{ github.run_id }}
      # docker-compose.test.yml's nats service declares these `:?`-required (T3-10
      # NATS auth), so they must be non-empty for ANY compose command to parse —
      # even `up postgres`. This gate starts ONLY postgres (nats never boots), so
      # placeholder pubkeys suffice; they are never validated by a nats server.
      IBX_TEST_NATS_APP_NKEY_PUBLIC: UREPLAYGATEAPPNKEYPLACEHOLDERONLYNOTAREALKEY00000000000
      IBX_TEST_NATS_CAPTURE_NKEY_PUBLIC: UREPLAYGATECAPNKEYPLACEHOLDERONLYNOTAREALKEY00000000000
      IBX_TEST_NATS_TRIGGER_NKEY_PUBLIC: UREPLAYGATETRGNKEYPLACEHOLDERONLYNOTAREALKEY00000000000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@5b4374b04084dc1f9032b52464284b769ac5059e # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ibatexas/domain db:generate

      # Build only the CLI and its workspace dependency closure (includes the
      # first-party packs the replay adjudicates with) — not the apps.
      - name: Build the CLI + workspace deps
        run: pnpm --filter "@ibatexas/cli..." build

      # Infra-only test compose, postgres service only. Dedicated project name
      # → dedicated containers/volumes; GH-hosted runner teardown is VM
      # destruction, the `down -v` below is belt-and-suspenders. The NATS nkey
      # placeholders in the job `env:` above let compose interpolate the (unstarted)
      # nats service; postgres keeps the compose defaults that match DATABASE_URL.
      - name: Boot ephemeral audit Postgres (docker compose)
        run: docker compose -f docker-compose.test.yml -p "$COMPOSE_PROJECT" up -d --wait postgres

      - name: Apply the kernel audit schema (audit-postgres migrations)
        run: node packages/cli/dist/index.js kernel migrate

      # Seed the committed golden vectors (recorded_at = now; ensures the
      # current-month intent_audit partition) and replay the window.
      # --ci hard-fails on a vacuous gate; exit 2 = policy drift.
      - name: Kernel replay gate (seed golden vectors → replay --ci)
        run: >
          node packages/cli/dist/index.js kernel replay --ci --json
          --seed-file packages/cli/governance/replay-golden-vectors.json

      - name: Teardown compose project
        if: always()
        run: docker compose -f docker-compose.test.yml -p "$COMPOSE_PROJECT" down -v --remove-orphans || true
