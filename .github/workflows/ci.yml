name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@5b4374b04084dc1f9032b52464284b769ac5059e # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ibatexas/domain db:generate
      - run: pnpm lint
      # Fail-fast diagnostic: T4 / R2-2 / T6 conformance suites use Postgres +
      # Redis testcontainers. ubuntu-latest ships with Docker preinstalled, but
      # we probe `docker info` first so an unavailable daemon surfaces as a
      # clear error rather than a cryptic mid-suite testcontainer-boot failure.
      - name: Verify Docker is available (testcontainer prerequisite)
        run: docker info
      # Force the lcov reporter for EVERY package so SonarCloud gets coverage
      # from all of them. The root vitest.config sets reporter=[text,lcov], but
      # packages with their OWN vitest.config (apps/api, domain, …) don't inherit
      # it and would otherwise emit no lcov → 0% coverage. Passing the reporter
      # on the CLI applies it uniformly across the turbo fan-out.
      #
      # IMPORTANT: invoke turbo directly with a SINGLE `--` passthrough. The old
      # `pnpm test -- -- --coverage` form double-stacked the separator, so vitest
      # received `vitest run -- --coverage` and treated `--coverage` as a positional
      # test-name FILTER (not a flag) → coverage never ran → no lcov → Sonar 0% for
      # every file. `turbo test -- --coverage` reaches the task as `vitest run --coverage`.
      #
      # --testTimeout=60000: v8 coverage instrumentation + the parallel turbo fan-out
      # across ~19 packages (each booting Postgres/Redis testcontainers) slows tests on
      # CI cores; the default 5s timeout flakes under that load (e.g. pack-payments).
      # 60s is ample headroom for unit tests and keeps this required `check` job green.
      - run: pnpm exec turbo test -- --coverage --coverage.reporter=lcov --coverage.reporter=text --testTimeout=60000
      # Bypass-detection CI gate (task 20). Fails the build if any direct
      # prisma write, direct medusa write, executeToolDirect re-introduction,
      # or setMetricsSink(undefined) reset enters the codebase. The vitest
      # suite is already run by `pnpm test` above, but we invoke the
      # consolidated entry point explicitly so the gate is visible in CI logs.
      - name: Bypass-detection CI gate
        run: ./scripts/check-bypass.sh
      # FE-D08 — pnpm 10's audit client targets the npm registry's legacy
      # /v1/security/audits{,/quick} endpoints, retired (HTTP 410) since
      # 2026-07-15. The fix (bulk /v1/security/advisories/bulk endpoint)
      # landed in pnpm 11, but bumping the workspace's pinned packageManager
      # to pnpm 11 is a real migration (pnpm 11 stops reading package.json's
      # "pnpm" field entirely — overrides/onlyBuiltDependencies/auditConfig
      # move to pnpm-workspace.yaml, and a --frozen-lockfile install fails
      # until that migration lands), so this step alone invokes a pinned
      # pnpm 11 via npx WITHOUT touching the workspace's pnpm 10 pin used by
      # every other step. `pm-on-fail=ignore` is required: pnpm 11 otherwise
      # self-re-execs the packageManager-pinned pnpm 10 on start (silently
      # re-hitting the dead endpoint) — verified empirically, this is the
      # ONLY way to actually run pnpm 11's binary in a pnpm-10-pinned repo.
      # auditConfig.ignoreGhsas lives in pnpm-workspace.yaml (pnpm 11's read
      # location for this config — pnpm 10 ignores that key harmlessly).
      # Full workspace migration to pnpm 11 tracked as FE-D08.
      - name: Security audit
        run: npx -y pnpm@11.13.1 audit --audit-level=high
        env:
          pnpm_config_pm_on_fail: ignore
      - run: pnpm build
      # Pack governance gates (F11/F12). The Tier-3 planner-coherence checks
      # already ride `pnpm test` (per-pack conformance suites); these add the
      # AI-BOM drift gate (EU AI Act Art. 11 / NIST AI RMF) and the Tier-1
      # policy analyzers. Both need the built CLI + pack dists → after build.
      - name: AI-BOM drift gate (F12)
        run: node packages/cli/dist/index.js kernel pack-bom --verify-file packages/cli/governance/pack-bom-baseline.json
      - name: Policy-coherence gate (F11)
        run: node packages/cli/dist/index.js kernel analyze
      # Governance ARTIFACT exporters (ERDS-055/056/057). Distinct from the
      # gates above: these verify the committed AI-BOM / config-seal /
      # policy-coherence JSON artifacts have not drifted from the live packs.
      # Re-generate with `ibx aibom|seal|coherence export --out <path>`.
      - name: AI-BOM artifact drift gate (ERDS-055)
        run: node packages/cli/dist/index.js aibom export --verify-file packages/cli/governance/ai-boms/ibatexas.json
      - name: Config-seal artifact drift gate (ERDS-056)
        run: node packages/cli/dist/index.js seal export --verify-file packages/cli/governance/seals/ibatexas.json
      - name: Policy-coherence artifact drift gate (ERDS-057)
        run: node packages/cli/dist/index.js coherence export --verify-file packages/cli/governance/coherence/ibatexas.json
      # Normalize per-package lcov SF paths to repo-root-relative so SonarCloud
      # can match coverage to sources. vitest emits SF paths relative to each
      # package (e.g. `SF:src/foo.ts` in packages/domain), but the scanner runs
      # from the repo root with sonar.sources=<pkg>/src — so without this the
      # gate reports "0.0% Coverage on New Code". Idempotent (rewrites SF:src/ only).
      - name: Normalize lcov paths for SonarCloud (monorepo)
        run: |
          shopt -s nullglob
          for f in apps/*/coverage/lcov.info packages/*/coverage/lcov.info; do
            pkg=$(dirname "$(dirname "$f")")
            sed -i -E "s#^SF:src/#SF:$pkg/src/#" "$f"
          done
          echo "Normalized lcov SF paths (sample):"
          grep -h "^SF:" apps/*/coverage/lcov.info packages/*/coverage/lcov.info 2>/dev/null | sort -u | head -10
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
