name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@5b4374b04084dc1f9032b52464284b769ac5059e # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ibatexas/domain db:generate
      - run: pnpm lint
      # Fail-fast diagnostic: T4 / R2-2 / T6 conformance suites use Postgres +
      # Redis testcontainers. ubuntu-latest ships with Docker preinstalled, but
      # we probe `docker info` first so an unavailable daemon surfaces as a
      # clear error rather than a cryptic mid-suite testcontainer-boot failure.
      - name: Verify Docker is available (testcontainer prerequisite)
        run: docker info
      - run: pnpm test -- -- --coverage
      # Monorepo coverage→Sonar fix: per-package vitest emits lcov with
      # package-relative `SF:` paths (e.g. `SF:src/x.ts`), but SonarCloud
      # resolves `sonar.sources` from the repo root (`packages/foo/src/x.ts`),
      # so coverage never maps → "0.0% Coverage on New Code". Rewrite each
      # lcov's SF: paths to be root-relative before the scan. Idempotent.
      - name: Normalize lcov paths for SonarCloud (monorepo)
        run: |
          for f in apps/*/coverage/lcov.info packages/*/coverage/lcov.info; do
            [ -f "$f" ] || continue
            dir="${f%/coverage/lcov.info}"
            sed -i "s#^SF:\(${dir}/\)\{0,1\}#SF:${dir}/#" "$f"
          done
      # Bypass-detection CI gate (task 20). Fails the build if any direct
      # prisma write, direct medusa write, executeToolDirect re-introduction,
      # or setMetricsSink(undefined) reset enters the codebase. The vitest
      # suite is already run by `pnpm test` above, but we invoke the
      # consolidated entry point explicitly so the gate is visible in CI logs.
      - name: Bypass-detection CI gate
        run: ./scripts/check-bypass.sh
      - name: Security audit
        run: pnpm audit --audit-level=high
      - run: pnpm build
      # Pack governance gates (F11/F12). The Tier-3 planner-coherence checks
      # already ride `pnpm test` (per-pack conformance suites); these add the
      # AI-BOM drift gate (EU AI Act Art. 11 / NIST AI RMF) and the Tier-1
      # policy analyzers. Both need the built CLI + pack dists → after build.
      - name: AI-BOM drift gate (F12)
        run: node packages/cli/dist/index.js kernel pack-bom --verify-file packages/cli/governance/pack-bom-baseline.json
      - name: Policy-coherence gate (F11)
        run: node packages/cli/dist/index.js kernel analyze
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
