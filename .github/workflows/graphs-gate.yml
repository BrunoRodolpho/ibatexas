# Graphs gate (T2-4) — regenerate-and-diff PR check over the four DERIVED
# graph artifacts (packages/journeys/graphs/*.json).
#
# What it proves: the committed graphs are byte-identical to what
# `ibx graph export` derives from the CURRENT inputs — the composed packs +
# capability planners (capability graph, incl. the P0-7 dangling/
# unadvertised roster flags), the Journey Registry (journey graph — the
# blocked-journey backlog visualization), and the checked-in run/impact
# fixtures. A pack / planner / registry / generator change without
# regeneration fails this check; the fix is `ibx graph export` + committing
# the diff (that diff review IS the composition-change review). Contract +
# regeneration discipline: packages/journeys/graphs/README.md.
#
# Zero LLM tokens, zero databases: the impact graph regenerates from the
# committed window fixture (captured from the test stack via
# `ibx graph export --capture-impact`), never from a live intent_audit.
#
# Exit: `ibx graph export --check` is nonzero on any drifted or missing
# artifact (exportGraphs in packages/journeys/src/graphs/export.ts).

name: Graphs gate

on:
  pull_request:
    paths:
      # Capability-graph inputs — the composition surfaces.
      - "packages/pack-*/src/**"
      - "packages/packs-composed/**"
      - "packages/intent-kinds/**"
      # Journey-graph input — the registry.
      - "packages/journeys/journeys/**"
      # The artifacts + fixtures + generators + the thin CLI.
      - "packages/journeys/graphs/**"
      - "packages/journeys/src/graphs/**"
      - "packages/journeys/src/gates/**"
      - "packages/cli/src/commands/graph.ts"
      - ".github/workflows/graphs-gate.yml"

permissions:
  contents: read

concurrency:
  group: graphs-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphs-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@5b4374b04084dc1f9032b52464284b769ac5059e # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ibatexas/domain db:generate

      # Build only the CLI and its workspace dependency closure (includes
      # @ibatexas/journeys + the composed packs the capability graph derives
      # from) — not the apps.
      - name: Build the CLI + workspace deps
        run: pnpm --filter "@ibatexas/cli..." build

      # Regenerate all four graphs in memory and byte-diff against the
      # committed artifacts — nonzero exit on any drift or missing file.
      - name: Graph drift gate (regenerate-and-diff)
        run: node packages/cli/dist/index.js graph export --check --json
