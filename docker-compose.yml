services:

  postgres:
    # pgvector/pgvector:pg17 = official postgres:17 + pgvector preinstalled. The
    # claustrum grounding layer (001-create-claustrum-grounding-docs.sql, run by
    # `ibx bootstrap` / `ibx db provision`) issues CREATE EXTENSION vector; the
    # stock postgres:17-alpine image lacks pgvector and fails with
    # `extension "vector" is not available`. Same env/healthcheck semantics.
    image: pgvector/pgvector:pg17
    container_name: ibatexas-postgres
    # BKL-284: the core four carry the BKL-266 treatment too. A Docker Desktop
    # quit / host reboot / daemon crash left ALL of postgres+redis+typesense+nats
    # down until the next full `ibx dev`, and every app boots into a void: the
    # 2026-07-27 incident had Medusa hang before binding :9000 and get SIGTERMed
    # by its own readiness probe, because :5433 never answered. Second measured
    # occurrence of apps booting into absent infra. `unless-stopped` still
    # honours a deliberate `docker stop`, so the opt-out path stays intact.
    # NOTE: a restart policy does NOT survive `docker compose down` — that
    # removes the container outright. See the PR body for the removal-path trace.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: ibatexas-redis
    # BKL-284: see the postgres note — core infra survives a daemon restart.
    restart: unless-stopped
    # AUDIT-FIX: INFRA-12 — Require password for Redis (prevents unauthenticated access)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-localdev}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # AUDIT-FIX: INFRA-12 — Pass password for authenticated health check
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  typesense:
    image: typesense/typesense:27.1
    container_name: ibatexas-typesense
    # BKL-284: see the postgres note — core infra survives a daemon restart.
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/8108' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  nats:
    image: nats:2.11-alpine
    container_name: ibatexas-nats
    # BKL-284: see the postgres note — core infra survives a daemon restart.
    restart: unless-stopped
    # T3-10: server-side auth (docs/security/NATS-AUTH-REQUIREMENTS.md) — the
    # server now REFUSES unauthenticated clients. Config-driven boot (the conf
    # carries jetstream + monitor, replacing the old flag-style command).
    # NATS_APP_NKEY_PUBLIC comes from .env (compose auto-loads it for
    # interpolation; the :? guard fails loudly when missing). Provision the
    # per-machine keypair with ./scripts/nats/gen-dev-nats-auth.sh — it writes
    # NATS_NKEY_SEED (client side) + NATS_APP_NKEY_PUBLIC (server side) to .env.
    command: ["-c", "/etc/nats/nats-server.conf"]
    environment:
      NATS_APP_NKEY_PUBLIC: ${NATS_APP_NKEY_PUBLIC:?run ./scripts/nats/gen-dev-nats-auth.sh to provision NATS auth in .env (T3-10)}
    ports:
      - "127.0.0.1:4222:4222"   # client connections
      - "127.0.0.1:8222:8222"   # monitoring UI
    volumes:
      - ./infra/nats/nats-server.app.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4222 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  typesense_data:
  nats_data:
