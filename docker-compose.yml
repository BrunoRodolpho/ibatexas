services:

  postgres:
    image: postgres:17-alpine
    container_name: ibatexas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: ibatexas-redis
    # AUDIT-FIX: INFRA-12 — Require password for Redis (prevents unauthenticated access)
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-localdev}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # AUDIT-FIX: INFRA-12 — Pass password for authenticated health check
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-localdev}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  typesense:
    image: typesense/typesense:27.1
    container_name: ibatexas-typesense
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/8108' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  nats:
    image: nats:2.11-alpine
    container_name: ibatexas-nats
    command: ["--jetstream", "--store_dir", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"   # client connections
      - "127.0.0.1:8222:8222"   # monitoring UI
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4222 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  # Observability log store — structured JSON (pino) ingest + LogsQL web UI.
  # The api ships its pino stream to /insert/jsonline (failure-isolated; an
  # outage here never affects a turn). UI + LogsQL at http://localhost:9428.
  # Single Go binary built FROM scratch → no shell, so no container healthcheck;
  # `ibx svc health` / `ibx doctor` probe http://localhost:9428/health from the
  # host. Image: docker.io/victoriametrics/victoria-logs (bump the tag if the
  # pull 404s — old tags never disappear, newer ones add features).
  victorialogs:
    image: victoriametrics/victoria-logs:v1.0.0-victorialogs
    container_name: ibatexas-victorialogs
    command:
      - "--storageDataPath=/vlogs"
      - "--httpListenAddr=:9428"
      - "--retentionPeriod=7d"
    ports:
      - "127.0.0.1:${VICTORIALOGS_PORT:-9428}:9428"
    volumes:
      - victorialogs_data:/vlogs
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  typesense_data:
  nats_data:
  victorialogs_data:
