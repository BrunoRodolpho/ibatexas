        confirmationRequired: false

  - id: casual-fecha-pra-nos
    utterance: fecha esse aí pra nós, somos 7
    note: >-
      Casual register ("fecha esse aí pra nós"). Second turn after
      check_availability returned slot_123.
    expectPayload:
      extractionIR:
        payload:
          timeSlotId: slot_123
          partySize: 7
        provenanceTrust:
          timeSlotId: untrusted
          partySize: untrusted
      hydratedIntentIR:
        payload:
          timeSlotId: slot_123
          partySize: 7
        confirmationRequired: false

  # ── Arm (b): ungrounded/stale slot reference — the guard, not
  #    extraction, is the actual safety net. ────────────────────────────
  - id: stale-slot-reference-guard-refuses
    utterance: fecha aquele horário de ontem que vocês mostraram, pra 4 pessoas
    note: >-
      Second turn referencing a PAST turn's slot (slot_stale) that has
      since lapsed — "de ontem" (from yesterday). The model faithfully
      relays the id it was shown; the REFUSE comes from
      requireSlotInFuture (the kernel guard), independent of whether
      extraction itself was accurate. Proves the guard is the real
      backstop, not extraction fidelity.
    expectPayload:
      extractionIR:
        payload:
          timeSlotId: slot_stale
          partySize: 4
        provenanceTrust:
          timeSlotId: untrusted
          partySize: untrusted
      hydratedIntentIR:
        payload:
          timeSlotId: slot_stale
          partySize: 4
        confirmationRequired: false
      decision: REFUSE

  # ── Arm (c): absence — no prior read in context, model correctly omits
  #    timeSlotId rather than inventing one. ─────────────────────────────
  - id: no-prior-read-absence
    utterance: quero reservar uma mesa pra 4 pessoas
    note: >-
      NO preceding check_availability turn at all — a bare "book me a
      table" with no slot ever surfaced. The model has nothing to relay
      and must NOT fabricate a timeSlotId (the schema's own instruction:
      "SEMPRE um id já retornado... NUNCA inventado"). extractionIR omits
      the field entirely; hydration adds nothing (no auto-resolve exists
      for a brand-new resource); requireSlotWithCapacity REFUSEs on the
      null slot.
    expectPayload:
      extractionIR:
        payload:
          partySize: 4
        provenanceTrust:
          partySize: untrusted
      hydratedIntentIR:
        payload:
          partySize: 4
        confirmationRequired: false
      decision: REFUSE
