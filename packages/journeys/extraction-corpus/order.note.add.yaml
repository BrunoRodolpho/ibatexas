  - id: casual-so-avisando
    utterance: só avisando, meu pedido é sem picles e sem maionese
    note: Casual register ("só avisando").
    expectPayload:
      extractionIR:
        payload:
          body: sem picles e sem maionese
        provenanceTrust:
          body: untrusted
      hydratedIntentIR:
        payload:
          body: sem picles e sem maionese
        payloadPresent:
          - orderId
        provenanceTrust:
