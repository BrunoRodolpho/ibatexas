          body: untrusted
        confirmationRequired: true

  - id: allergy-mention-in-note
    utterance: "adiciona uma nota no meu pedido: tenho alergia a amendoim, por favor cuidado"
    note: >-
      Allergy mentioned in a free-text note — the mention legitimately lands
      in `body` (Directive-class note content, field-trust.ts's own
      definition), same posture as payment.refund.issue.yaml's own allergy-
      mention cases. This is NOT the structured Hard-Rule-#1 allergens array
      (order.item.add's schema, which this capability's schema has no slot
      for regardless).
    expectPayload:
      extractionIR:
        payload:
          body: tenho alergia a amendoim, por favor cuidado
        provenanceTrust:
          body: untrusted
      hydratedIntentIR:
        payload:
          body: tenho alergia a amendoim, por favor cuidado
        payloadPresent:
          - orderId
        provenanceTrust:
          orderId: grounded
          body: untrusted
        confirmationRequired: true

  # ── Arm: absence — a bare invocation with NO note content at all. The
  #    model must NOT fabricate a body (the schema's own instruction: "nunca
  #    resuma, parafraseie ou invente conteúdo"); extractionIR correctly
  #    omits the field. Since `body` is this capability's ONLY field and is
  #    required, an honest omission is not a silent no-op: pack-orders'
  #    `executeNoteAdd` guard (policies.ts) REFUSEs on an empty/missing body
  #    (`note_body_empty`) — the closest this capability comes to a CLARIFY,
  #    since the schema has no slot to ask a follow-up question through;
  #    the customer sees an honest "what should the note say?" refusal
  #    rather than a silently-created empty note. ──────────────────────────
  - id: bare-no-content-absence
    utterance: adiciona uma observação no meu pedido
    note: >-
      No note text anywhere in the utterance — just the bare capability
      request. extractionIR.payload is correctly EMPTY (body absent, never
      invented — the FE-T14 persona-refinement finding this case exists to
      pin: the model must NOT fabricate content for an empty field). Decision
      is REQUEST_CONFIRMATION, not REFUSE — live-calibration finding: orderId
      is auto-resolved ("most recent order"), and every auto-resolve kind
      forces a park-for-confirmation BEFORE the executeNoteAdd empty-body
      guard gets a chance to run (that guard only fires at EXECUTE time, on
      confirm). This is a pre-existing sequencing property of the shared
      auto-resolve-confirm path (order.cancel/note.add/amend all share it),
      not a persona-lever regression — documented here rather than pinning a
      decision this case never live-produces.
    expectPayload:
      extractionIR:
        payload: {}
      hydratedIntentIR:
        payloadPresent:
          - orderId
        provenanceTrust:
          orderId: grounded
        confirmationRequired: true
      decision: REQUEST_CONFIRMATION
