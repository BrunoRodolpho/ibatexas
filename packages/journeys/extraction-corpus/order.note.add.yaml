# order.note.add — FE-T14. `body` is the only model-extractable field
# (Directive, required, free text) — CRITICAL DESIGN RULE 6 (verbatim-
# fidelity): the model must copy the note text EXACTLY, never summarize,
# paraphrase, or invent content that lands in an audit record.
#
# `order.note.add` was ALREADY fully wired for auto-resolve BEFORE this
# ticket (ORDER_AUTORESOLVE_KINDS + AUTORESOLVE_CONFIRM_KINDS both already
# list it) — `orderId` is a "most recent order" GUESS, hence `grounded` and
# confirmationRequired: true, same posture as order.status.transition.
capability: order.note.add
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
plane: customer
cases:
  - id: basic-no-onion
    utterance: "adiciona uma observação no meu pedido: sem cebola, por favor"
    note: >-
      Canonical shape (the schema's own worked example) — direct register,
      explicit note text after a colon.
    expectPayload:
      extractionIR:
        payload:
          body: sem cebola, por favor
        provenanceTrust:
          body: untrusted
      hydratedIntentIR:
        payload:
          body: sem cebola, por favor
        payloadPresent:
          - orderId
        provenanceTrust:
          orderId: grounded
          body: untrusted
        confirmationRequired: true

  - id: formal-gostaria
    utterance: Gostaria de anotar no meu pedido que o entregador toque a campainha duas vezes.
    note: Formal/polite register, longer note content.
    expectPayload:
      extractionIR:
        payload:
          body: o entregador toque a campainha duas vezes
        provenanceTrust:
          body: untrusted
      hydratedIntentIR:
        payload:
          body: o entregador toque a campainha duas vezes
        payloadPresent:
          - orderId
        provenanceTrust:
          orderId: grounded
          body: untrusted
        confirmationRequired: true

