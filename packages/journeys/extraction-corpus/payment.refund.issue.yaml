# payment.refund.issue — the FE-T10 money-tier safety-critical extraction
# corpus (D5: ~40 for safety-critical capabilities — allergens, PII, money).
#
# SETUP PRECONDITION (money capabilities need an explicit order reference —
# unlike order.status.transition, refund has no "most recent order" ambient
# fallback, so every case below names a specific order). Before driving this
# corpus, seed exactly these two FIXED, RESEEDABLE fixtures (a dedicated
# display-id band BELOW WS9_DISPLAY_ID_BASE=900_000 so it never collides with
# the random WS9 live-suite band):
#
#   tsx packages/journeys/src/live/seed-refundable-order.ts \
#       --amount-reais 100 --method cash --display-id 810001
#   tsx packages/journeys/src/live/seed-refundable-order.ts \
#       --amount-reais 2000 --method cash --display-id 810002
#
# 810001 (R$100 balance) drives every CONFIRM-band case; 810002 (R$2000
# balance, above the R$1000 escalate threshold) drives the ESCALATE-band and
# boundary cases. Re-seed before each corpus run (a case never sends "sim",
# so a balance is never actually consumed — but re-seeding is cheap and keeps
# the fixture state honest across repeated runs).
#
# Unit semantics (see payment-refund-issue.schema.ts's header): the model
# emits `amount` in REAIS; the resolver (BKL-094, ops-resolver.ts) coerces to
# EXACT integer centavos (`refundAmountCentavos`) — every case below asserts
# THAT resolved wire value, never a reais float, matching CLAUDE.md rule #2.
#
# Safety properties this corpus proves (FE-T10 acceptance criteria):
#   1. Amounts extract correctly across register/notation diversity, and every
#      sub-escalate-threshold case FORCES confirmation (decision:
#      REQUEST_CONFIRMATION) — the BKL-085 UNTRUSTED-taint overlay, proven
#      live, never bypassed by a typed schema. Cases at/above the R$1000
#      escalate threshold instead FORCE decision: ESCALATE (the ladder order
#      is preserved: escalate pre-empts confirm).
#   2. PII fields (cpf/email/phone) are NEVER model-populated: several cases
#      embed PII-adjacent text alongside a legitimate refund request;
#      `extractionIR`'s default `payloadExactKeys: true` structurally proves
#      no `cpf`/`email`/`phone` key ever reaches the payload (the schema has
#      no such field — `additionalProperties: false` on the wire — and these
#      cases empirically confirm the live model never smuggles one in).
#   3. Allergen fields are NEVER model-populated: two cases mention an
#      allergy; the SAME `payloadExactKeys: true` proves no structured
#      `allergens` key ever appears (an allergy MENTION may legitimately
#      land in the free-text `reason` field — that is Directive-class note
#      content per field-trust.ts's own definition, NOT the Hard-Rule-#1
#      structured allergens array this criterion guards against).
#
# Live-caught during authoring (documented, not silently worked around):
#   - A parked REQUEST_CONFIRMATION survives in the claustrum Session
#     (`claustrum:session:admin:<staffId>`), a SEPARATE Redis key from the
#     ops chat-history one — `accuracy-cli.ts`'s `createOpsHistoryClearer`
#     now clears BOTH per case (see accuracy-runner.ts's module header). This
#     corpus's cases were authored/verified AFTER that fix; driving them
#     without it risks a later case's ordinary utterance being misread as a
#     confirmation of an EARLIER case's still-parked refund (the ops
#     confirmation lexicon's affirmative tokens — "pode", "ok", "manda",
#     "claro", "isso", "beleza" — collide with ordinary refund phrasing).
#     None of the utterances below use those tokens either, belt and braces.
#   - The local 4B does not reliably recognize "pratas" (BR slang for reais)
#     as a currency term — it defaults to the full-balance path instead of
#     extracting the stated figure. Not included below (a corpus case
#     authored against a KNOWN, un-waived failure would immediately regress
#     the baseline); tracked as a follow-up if slang coverage is ever
#     prioritized, not a blocker for this ticket's acceptance criteria.
capability: payment.refund.issue
source: tickets/language-engine/issues/10-safety-critical-extraction-schema-lint.md
