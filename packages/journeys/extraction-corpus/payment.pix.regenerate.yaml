# payment.pix.regenerate — the FE-T11 customer-plane money-tier extraction
# corpus (D5: ~20-40 for safety-critical capabilities — this schema declares
# ZERO model-fillable fields, see payment-pix-regenerate.schema.ts's header,
# so every case's `extractionIR.payload` is asserted empty; the corpus's
# value is proving CAPABILITY SELECTION is robust across phrasing register —
# unlike the ops-plane capabilities (order.status.transition,
# payment.refund.issue), the customer PLANNER_PERSONA carries NO
# per-capability mapping guidance at all (see extraction-prompt-fragment-
# support.ts's header) — this capability is selected from the tool's own
# description ("Gerar um novo código PIX para um pagamento pendente.") plus
# the generic persona alone.
#
# SETUP PRECONDITION — CUSTOMER-PLANE, not ops. Unlike order.status.transition
# / payment.refund.issue (driven over the ops-chat route,
# `driveExtractionCorpusOverOpsChat`, accuracy-runner.ts), this capability is
# reached through the CUSTOMER chat route as an AUTHENTICATED customer.
# `accuracy-runner.ts`'s own module doc documents this gap explicitly: "a
# future customer-plane capability's corpus would need a customer-session
# drive path added alongside this one — not built speculatively (YAGNI)."
# That customer-session drive path does not exist yet as of this ticket
# (FE-T11) — this corpus is committed and schema-valid, but `ibx journey
# extraction-accuracy` cannot yet DRIVE it live. The anticipated recipe
# (worked, see status-explain-liveproof-testplane note / BKL-easy OTP bypass):
#
#   1. POST /api/auth/send-otp {phone}, then POST /api/auth/verify-otp
#      {phone, code:"424242"} (IBX_DEV_OTP_BYPASS) -> customer JWT cookie.
#   2. Seed a governed order + payment for that customer:
#      tsx packages/journeys/src/live/seed-refundable-order.ts \
#          --amount-reais 50 --method cash --customer-id <id>
#      (any non-terminal payment on the customer's MOST RECENT order is
#      sufficient for calibration purposes — the confirm-on-autoresolve
#      guard fires and the turn PARKS at REQUEST_CONFIRMATION before
#      `regeneratePix()`'s own business preconditions — method/status/rate-
#      limit — are ever evaluated. No case below sends a confirming "sim",
#      so nothing is actually consumed/regenerated, mirroring
#      payment.refund.issue.yaml's own "a case never sends sim" discipline.)
#   3. Drive turns over POST /api/chat/messages {sessionId, message,
#      channel:"web"} with the customer cookie (never hold the SSE stream
#      open while driving — a client disconnect mid-turn silently aborts it).
#
# Independent-truth discipline (FE-2.1): `expectPayload` below is AUTHORED
# here, never derived from the model under test. Every case pins the SAME
# hydration outcome (`extractionIR.payload: {}`, `hydratedIntentIR.payload:
# {orderId: <resolved>}`, `orderId` grounded, `confirmationRequired: true`,
# `decision: REQUEST_CONFIRMATION`) — the schema has no enum/amount axis to
# vary (unlike order.status.transition's 6 statuses or payment.refund.issue's
# amount ladder), so the corpus's diversity axis is PHRASING REGISTER alone,
# plus a distinct "adversarial" block: cases where the customer volunteers an
# order number / name / PII / an amount / a reason IN THE UTTERANCE despite
# the schema having no field to receive any of them — proving the closed
# `additionalProperties:false` wire shape holds even when the model has a
# tempting, superficially-relevant string to smuggle somewhere.
capability: payment.pix.regenerate
source: tickets/language-engine/issues/11-rollout-payments-money-tier.md
cases:
  - id: informal-basic
    utterance: gera um novo código pix pra mim, o antigo expirou
    note: Direct/informal register, the canonical trigger phrasing.
    expectPayload:
      extractionIR:
        payload: {}
      hydratedIntentIR:
        payload: {}
        payloadPresent:
          - orderId
        provenanceTrust:
          orderId: grounded
        confirmationRequired: true
      decision: REQUEST_CONFIRMATION

