# reservation.cancel — FE-T14. `reason` is the only model-extractable field
# (Directive, optional, free text). Already fully wired for auto-resolve
# BEFORE this ticket (RESERVATION_AUTORESOLVE_KINDS + AUTORESOLVE_CONFIRM_
# KINDS both already listed it) — `reservationId` is a "the one active
# booking" GUESS, hence `grounded` and confirmationRequired: true, same
# posture as order.status.transition.
capability: reservation.cancel
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
plane: customer
cases:
  - id: basic-with-reason
    utterance: cancela minha reserva, surgiu um imprevisto
    note: Canonical shape (the schema's own worked example) — direct register.
    expectPayload:
      extractionIR:
        payload:
          reason: surgiu um imprevisto
        provenanceTrust:
          reason: untrusted
      hydratedIntentIR:
        payload:
          reason: surgiu um imprevisto
        payloadPresent:
          - reservationId
        provenanceTrust:
          reservationId: grounded
          reason: untrusted
        confirmationRequired: true

  - id: no-reason-bare
    utterance: cancela minha reserva
    note: No reason mentioned at all — reason field absent.
    expectPayload:
      extractionIR:
        payload: {}
      hydratedIntentIR:
        payload: {}
        payloadPresent:
          - reservationId
        provenanceTrust:
          reservationId: grounded
        confirmationRequired: true

  - id: formal-gostaria
    utterance: Gostaria de cancelar minha reserva, por favor.
    note: Formal/polite register, no explicit reason.
    expectPayload:
      extractionIR:
        payload: {}
