# order.coupon.apply — FE-T14. `code` is the only model-extractable field
# (Directive, required, verbatim). Hydration stamps `cartId` as
# authoritative (deterministic session resolution) — confirmationRequired
# is always false.
capability: order.coupon.apply
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
cases:
  - id: aplica-promo10
    utterance: aplica o cupom PROMO10
    note: Canonical shape (the schema's own worked example) — direct register.
    expectPayload:
      extractionIR:
        payload:
          code: PROMO10
        provenanceTrust:
          code: untrusted
      hydratedIntentIR:
        payload:
          code: PROMO10
        payloadPresent:
          - cartId
        provenanceTrust:
          cartId: authoritative
        confirmationRequired: false

