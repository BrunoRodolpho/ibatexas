# order.amend.remove_item — FE-T14 BACKFILL. See order.amend.add_item.yaml's
# header for the full rationale (FE-T09 authored the schema, never grew a
# corpus; N≈10 low-risk-tier sizing; every utterance uses an EXPLICIT
# existing-order marker so amend-preference-correction.ts's BKL-154
# re-route fires unconditionally).
#
# Hydration (audit-metadata.ts's deriveGranularAmend,
# ORDER_AMEND_REMOVE_ITEM_RESOLVER_FIELDS = [orderId, itemId]): same shape
# as order.amend.update_qty's — orderId grounded (auto-resolved guess),
# itemId authoritative (resolveOrderLineItem, an explicit-reference lookup).
# Only `item` is model-extractable on this schema (no quantity field at
# all — removing a line removes the whole line).
capability: order.amend.remove_item
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
cases:
  - id: meu-pedido-basic
    utterance: tira a coca do meu pedido
    note: >-
      Canonical example (order-amend-granular.schema.ts's own worked
      example) — the `meuPedido` explicit marker, direct register.
    expectPayload:
      extractionIR:
        payload:
          item: coca
        provenanceTrust:
          item: untrusted
      hydratedIntentIR:
        payload:
          item: coca
        payloadPresent:
          - orderId
          - itemId
        provenanceTrust:
          orderId: grounded
          itemId: authoritative
        confirmationRequired: true

  - id: pedido-que-ja-fiz-formal
