  - id: slot-change-only
    utterance: muda minha reserva pra aquele outro horário que vocês acharam
    note: >-
      Slot-only change, no party size mentioned. Second turn of a
      conversation whose first turn was check_availability returning a
      NEW slot (slot_456) — "aquele outro horário" refers back to it.
    expectPayload:
      extractionIR:
        payload:
          newTimeSlotId: slot_456
        provenanceTrust:
