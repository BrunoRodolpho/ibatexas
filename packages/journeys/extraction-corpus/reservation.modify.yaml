# reservation.modify — FE-T14. `newPartySize` is Directive (a genuine
# customer-authored number). `newTimeSlotId` is State-class — a lookup key
# relayed from an EARLIER check_availability read (same framing as
# reservation.create.yaml's header; see it for the full rationale) — cases
# that change the slot document the assumed preceding turn in their `note`,
# with `slot_456` as an illustrative placeholder for a NEW slot the
# conversation already established (distinct from reservation.create.yaml's
# `slot_123`, since this is a DIFFERENT capability's corpus). Both fields
# are optional (a customer may change just the time, just the party size,
# or both) — CRITICAL DESIGN RULE 4 ("optional over required").
#
# FE-T14 added reservation.modify to RESERVATION_AUTORESOLVE_KINDS /
# AUTORESOLVE_CONFIRM_KINDS (mirroring reservation.cancel's existing
# treatment) — `reservationId` is "the one active booking" GUESS, hence
# `grounded` and confirmationRequired: true, same posture as
# reservation.cancel/order.status.transition.
capability: reservation.modify
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
plane: customer
cases:
  - id: basic-party-size-only
    utterance: muda minha reserva pra 6 pessoas
    note: >-
      Canonical shape (the schema's own worked example) — direct register,
      party-size-only change, no slot lookup needed.
    expectPayload:
      extractionIR:
        payload:
          newPartySize: 6
        provenanceTrust:
          newPartySize: untrusted
      hydratedIntentIR:
        payload:
          newPartySize: 6
        payloadPresent:
          - reservationId
        provenanceTrust:
          reservationId: grounded
          newPartySize: untrusted
        confirmationRequired: true

  - id: formal-party-size
