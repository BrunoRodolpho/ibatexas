# order.item.remove — FE-T14. Ordinary cart line removal — see
# order.item.add.yaml's header for why every case avoids the amend-
# preference-correction.ts existing-order markers ("carrinho" language
# only, never "pedido").
#
# Hydration: `itemId` is resolved from the model's NL `item` reference
# against the LIVE CART's line items (FE-T14's `resolveCartLineItem`) —
# authoritative, not a guess. Only `item` is model-extractable (no
# quantity field — removing a line removes the whole line).
capability: order.item.remove
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
cases:
  - id: tira-a-coca
    utterance: tira a coca do carrinho
    note: Canonical shape (the schema's own worked example) — direct register.
    expectPayload:
      extractionIR:
        payload:
          item: coca
        provenanceTrust:
          item: untrusted
      hydratedIntentIR:
        payload:
          item: coca
        payloadPresent:
          - cartId
          - itemId
        provenanceTrust:
          cartId: authoritative
          itemId: authoritative
        confirmationRequired: false

  - id: formal-remova
    utterance: Por favor, remova o hambúrguer do carrinho.
    note: Formal register.
    expectPayload:
      extractionIR:
