# order.item.add — FE-T14. Ordinary cart-building — the DEFAULT path for
# "quero X" style utterances. Every case below deliberately AVOIDS the
# amend-preference-correction.ts existing-order markers (`meu pedido` /
# `pedido que (eu) (já) fiz` / `pedido \d+` / `no pedido`) — those markers
# would re-route the proposal to order.amend.add_item instead (BKL-154),
# which is not this file's target capability. "carrinho" (cart) language is
# used instead of "pedido" (order) language throughout, so the correction
# never fires regardless of the driving session's cart state.
#
# Hydration (audit-metadata.ts's deriveGranularAmend, reused as-is):
# `variantId` is resolved from the model's explicit NL `item` reference
# (BKL-061, `resolveProductForItem`) — authoritative (not a guess);
# `allergens` presence is NOT asserted (seed-catalog-dependent, see
# order.amend.add_item.yaml's header for the same reasoning).
# confirmationRequired is always false (nothing here is auto-resolved from
# an implicit "which order?" guess — the active cart is deterministic).
capability: order.item.add
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
cases:
  - id: quero-uma-coca
    utterance: quero uma coca
    note: Canonical shape (the schema's own worked example) — direct register.
    expectPayload:
      extractionIR:
        payload:
          item: coca
          quantity: 1
        provenanceTrust:
          item: untrusted
          quantity: untrusted
      hydratedIntentIR:
        payload:
          item: coca
          quantity: 1
        payloadPresent:
          - cartId
          - variantId
        provenanceTrust:
          cartId: authoritative
          variantId: authoritative
        confirmationRequired: false

