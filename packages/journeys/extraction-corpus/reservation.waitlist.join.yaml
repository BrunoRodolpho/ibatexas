    utterance: me põe na fila desse horário aí, somos 5
    note: Colloquial register ("me põe na fila"). Second turn after check_availability returned slot_123.
    expectPayload:
      extractionIR:
        payload:
          timeSlotId: slot_123
          partySize: 5
        provenanceTrust:
