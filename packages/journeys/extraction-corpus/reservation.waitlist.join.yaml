  - id: polite-gentileza
    utterance: por gentileza, me coloca na espera desse horário pra 8 pessoas
    note: Very polite register ("por gentileza"). Second turn after check_availability returned slot_123.
    expectPayload:
      extractionIR:
        payload:
          timeSlotId: slot_123
          partySize: 8
        provenanceTrust:
          timeSlotId: untrusted
          partySize: untrusted
      hydratedIntentIR:
        payload:
          timeSlotId: slot_123
          partySize: 8
        confirmationRequired: false

  - id: context-embedded
    utterance: esse horário lotou, mas quero entrar na lista de espera pra 4 pessoas
    note: >-
      Context-embedded register — states the reason before the request.
      Second turn after check_availability returned slot_123.
    expectPayload:
      extractionIR:
        payload:
          timeSlotId: slot_123
          partySize: 4
        provenanceTrust:
          timeSlotId: untrusted
          partySize: untrusted
      hydratedIntentIR:
        payload:
          timeSlotId: slot_123
          partySize: 4
        confirmationRequired: false

  - id: formal-solicito
    utterance: Solicito a inclusão na lista de espera para esse horário, para 2 pessoas.
    note: Formal/bureaucratic register. Second turn after check_availability returned slot_123.
    expectPayload:
      extractionIR:
        payload:
          timeSlotId: slot_123
          partySize: 2
        provenanceTrust:
          timeSlotId: untrusted
          partySize: untrusted
