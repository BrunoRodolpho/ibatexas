  - id: casual-me-avisa
    utterance: me avisa se abrir uma vaga nesse horário, somos 3
    note: Casual register ("me avisa se abrir uma vaga"). Second turn after check_availability returned slot_123.
    expectPayload:
      extractionIR:
        payload:
          timeSlotId: slot_123
          partySize: 3
