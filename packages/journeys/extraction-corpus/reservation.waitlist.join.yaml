# reservation.waitlist.join — FE-T14. Same `timeSlotId` state-class
# lookup-key framing as reservation.create.yaml (see its header for the
# full rationale) — every case here is the second turn of a conversation
# whose first turn already established a full slot via check_availability;
# `slot_123` is an illustrative placeholder. `partySize` is Directive. Both
# required. NOT auto-resolved (a new waitlist entry, no existing target) —
# confirmationRequired is always false.
#
# Same THREE REQUIRED CORPUS ARMS as reservation.create.yaml (see its
# header for the full rationale) — grounded-selection (the bulk below),
# ungrounded/stale slot reference (guard REFUSEs regardless of extraction
# fidelity), and absence (no prior read, model correctly omits the field).
capability: reservation.waitlist.join
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
cases:
  - id: basic-four-people
    utterance: coloca eu na lista de espera daquele horário, somos 4
    note: >-
      Canonical shape (the schema's own worked example). Second turn after
      check_availability returned a FULL slot_123.
    expectPayload:
      extractionIR:
        payload:
          timeSlotId: slot_123
          partySize: 4
        provenanceTrust:
          timeSlotId: untrusted
          partySize: untrusted
      hydratedIntentIR:
        payload:
          timeSlotId: slot_123
          partySize: 4
        confirmationRequired: false

  - id: formal-gostaria
    utterance: Gostaria de entrar na lista de espera para esse horário, seremos 2 pessoas.
    note: Formal/polite register. Second turn after check_availability returned slot_123.
    expectPayload:
      extractionIR:
        payload:
          timeSlotId: slot_123
          partySize: 2
        provenanceTrust:
          timeSlotId: untrusted
          partySize: untrusted
      hydratedIntentIR:
        payload:
          timeSlotId: slot_123
          partySize: 2
        confirmationRequired: false

