    utterance: dá pra entrar na lista de espera desse horário, pra 3 pessoas?
    note: Question-form register ("dá pra...?"). Second turn after check_availability returned slot_123.
    expectPayload:
      extractionIR:
        payload:
          timeSlotId: slot_123
          partySize: 3
        provenanceTrust:
          timeSlotId: untrusted
          partySize: untrusted
      hydratedIntentIR:
        payload:
          timeSlotId: slot_123
