# order.status.transition — the FE-T05 first-tracer capability's extraction
# corpus (FE-T06/FE-T07, FE-2.1). Grown from the T05 canonical seed to the
# spec's D5 default denominator (N=20 per capability) — this file is now
# the permanent eval corpus for cap-1, authored directly (not yet run
# through the Sonnet paraphrase fan-out driver — FE-2.1/FE-2.3 remains a
# separate, later ticket for SCALING authorship; these 20 are hand-written).
#
# Independent-truth discipline: `expectPayload` below is AUTHORED here, never
# derived from the model under test (FE-2.1). It pins the FE-T05 contract:
# the model extracts ONLY `newStatus` (never `orderId` — Identity class,
# resolver-only); hydration auto-resolves "the most recent active order"
# (no explicit reference given), tagging it `grounded` (a guess, never
# `authoritative`) and forcing `confirmationRequired: true`.
#
# A structural note on WHY every case below is "implicit" (no case ever
# names a specific order): `resolveStatusTransitionOrderTarget`
# (apps/api/src/ops/ops-resolver.ts) tries an AUTHORITATIVE direct/reference
# lookup first (`resolveOrderTarget`, reading `payload.orderId`) before
# falling back to "most recent active" — but `order.status.transition`'s
# extraction schema never gives the model an `orderId` field to populate
# (Identity class, resolver-only), so `payload.orderId` is ALWAYS empty for
# this capability and that authoritative path is structurally unreachable
# today. An "explicit order reference" corpus variant would therefore
# exercise IDENTICAL HYDRATION behavior to an implicit one (the resolver
# still falls back to "most recent active" either way) — not a real second
# axis until a future rollout slice adds an explicit-reference field to
# this capability's schema. (Extraction itself is a separate claim: the
# model COULD still emit different raw output for an explicit-reference
# utterance — e.g. over-extraction attempting to stuff the mentioned id
# somewhere — even though the schema has no slot for it and hydration
# ignores it regardless; only the hydration outcome is guaranteed
# identical, not the extraction attempt.) FE-2.1's "implicit/explicit forms"
# guidance is honored on the axis that DOES vary today: phrasing register
# (formal/colloquial/brusque/question/context-embedded/casual) and the
# target status, across all 6 enum values
# (confirmed/preparing/ready/in_delivery/delivered/canceled).
capability: order.status.transition
source: tickets/language-engine/issues/07-extraction-accuracy-meter-baseline.md
# FE-T12: explicit plane declaration — this capability is ops-plane
# (advertised solely via pack-ops's staff allowlist; the model never sees it
# on a customer turn), so it drives over POST /api/admin/ops/chat.
plane: ops
cases:
  - id: most-recent-order-to-ready
    utterance: muda o status do meu último pedido para pronto
    note: >-
      The ticket's canonical example utterance. No explicit order reference
      is given, so hydration falls back to the most recent ACTIVE order
      (ops-order-resolution.ts's resolveMostRecentActiveOrder) — a GUESS,
      hence grounded + confirmationRequired.
    expectPayload:
      extractionIR:
        payload:
          newStatus: ready
        provenanceTrust:
          newStatus: untrusted
      hydratedIntentIR:
        payload:
          newStatus: ready
        payloadPresent:
          - orderId
        provenanceTrust:
          orderId: grounded
          newStatus: untrusted
        confirmationRequired: true

  - id: most-recent-order-to-confirmed
    utterance: confirma o pedido mais recente
    note: >-
      Direct imperative register, third status target (confirmed).
    expectPayload:
