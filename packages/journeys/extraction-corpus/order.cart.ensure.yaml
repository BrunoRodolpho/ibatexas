# order.cart.ensure — FE-T14. Zero-field extraction schema
# (order-cart-item.schema.ts) — `cartId` is 100% resolver-filled
# (BKL-028, the session's active-cart Redis key), so every case's
# extractionIR payload is `{}` by construction. Hydration
# (audit-metadata.ts's deriveGranularAmend, reused as-is) stamps `cartId`
# as `authoritative` (deterministic session resolution, never a guess —
# confirmationRequired is always false for this capability).
#
# N≈10 (low-risk-tier sizing, matching FE-T13's read-tool-corpus and
# order.amend.*'s FE-T14 backfill — not the N=20/N≈40 money/status-tracer
# denominators).
capability: order.cart.ensure
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
plane: customer
cases:
  - id: quero-fazer-pedido
    utterance: quero fazer um pedido
    note: >-
      The schema's own worked example — direct register, no item mentioned
      yet.
    expectPayload:
      extractionIR:
        payload: {}
      hydratedIntentIR:
        payload: {}
        payloadPresent:
          - cartId
        provenanceTrust:
          cartId: authoritative
        confirmationRequired: false

  - id: abre-um-carrinho
    utterance: abre um carrinho pra mim
    note: Colloquial register, explicit "carrinho" (cart) mention.
