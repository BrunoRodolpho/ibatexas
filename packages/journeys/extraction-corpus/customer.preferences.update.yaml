# customer.preferences.update — FE-T14. `dietary_restrictions`/`favorite_categories`
# are the only model-extractable fields, BOTH optional arrays of strings.
# `allergenExclusions` is REQUIRED on the wire but NEVER on this schema —
# resolve-and-assemble.ts's FE-T14 addition always resolver-preserves the
# customer's CURRENT saved value, so it is asserted `payloadPresent` +
# `authoritative` on every case (never a value this file can pin ahead of
# a live customer's saved row), confirmationRequired is always false.
#
# CRITICAL DESIGN RULE 1's own adversarial bar: several cases below mention
# an allergy/allergen ALONGSIDE a legitimate dietary/favorite-category
# statement — `payloadExactKeys: true` (extractionIR's default) structurally
# proves no `allergenExclusions`/`allergens` key EVER reaches the model-
# extracted payload, no matter how explicitly an allergen is named in the
# same utterance.
capability: customer.preferences.update
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
plane: customer
cases:
  - id: basic-vegetarian-and-favorite
    utterance: sou vegetariano e adoro comida grelhada
    note: Canonical shape (the schema's own worked example) — direct register.
    expectPayload:
      extractionIR:
        payload:
          dietary_restrictions: [vegetariano]
          favorite_categories: [grelhados]
        provenanceTrust:
          dietary_restrictions: untrusted
          favorite_categories: untrusted
      hydratedIntentIR:
        payload:
          dietary_restrictions: [vegetariano]
          favorite_categories: [grelhados]
        payloadPresent:
          - allergenExclusions
        provenanceTrust:
          allergenExclusions: authoritative
        confirmationRequired: false

  - id: dietary-only-vegan
    utterance: quero atualizar minhas preferências, sou vegano
    note: Dietary-only change, no favorite category mentioned.
    expectPayload:
      extractionIR:
        payload:
          dietary_restrictions: [vegano]
        provenanceTrust:
          dietary_restrictions: untrusted
      hydratedIntentIR:
        payload:
          dietary_restrictions: [vegano]
        payloadPresent:
          - allergenExclusions
        provenanceTrust:
          allergenExclusions: authoritative
        confirmationRequired: false

  - id: favorite-category-only
    utterance: adoro churrasco, salva isso nas minhas preferências
    note: Favorite-category-only change, no dietary restriction mentioned.
    expectPayload:
      extractionIR:
        payload:
          favorite_categories: [churrasco]
        provenanceTrust:
          favorite_categories: untrusted
      hydratedIntentIR:
        payload:
          favorite_categories: [churrasco]
        payloadPresent:
          - allergenExclusions
        provenanceTrust:
          allergenExclusions: authoritative
        confirmationRequired: false

  - id: formal-gostaria
    utterance: Gostaria de registrar que sou vegetariano em minhas preferências.
    note: Formal/polite register.
    expectPayload:
      extractionIR:
        payload:
          dietary_restrictions: [vegetariano]
        provenanceTrust:
          dietary_restrictions: untrusted
      hydratedIntentIR:
        payload:
          dietary_restrictions: [vegetariano]
        payloadPresent:
          - allergenExclusions
        provenanceTrust:
          allergenExclusions: authoritative
        confirmationRequired: false

  - id: gluten-free-colloquial
    utterance: não como glúten, pode anotar aí
    note: Colloquial register ("pode anotar aí").
    expectPayload:
      extractionIR:
        payload:
          dietary_restrictions: [sem glúten]
        provenanceTrust:
          dietary_restrictions: untrusted
      hydratedIntentIR:
        payload:
          dietary_restrictions: [sem glúten]
        payloadPresent:
          - allergenExclusions
        provenanceTrust:
          allergenExclusions: authoritative
        confirmationRequired: false

  - id: multiple-favorite-categories
    utterance: gosto muito de churrasco e também de comida japonesa
    note: Multiple favorite categories in one utterance.
    expectPayload:
      extractionIR:
        payload:
          favorite_categories: [churrasco, japonesa]
        provenanceTrust:
          favorite_categories: untrusted
      hydratedIntentIR:
        payload:
          favorite_categories: [churrasco, japonesa]
        payloadPresent:
          - allergenExclusions
        provenanceTrust:
          allergenExclusions: authoritative
        confirmationRequired: false

  # ── Allergen-mention honesty arm (required corpus pin) ───────────────────
  #
  # An allergen-shaped utterance must NEVER succeed as a silent no-op. The
  # structural safety property (no allergenExclusions/allergens key ever
  # reaches extractionIR) still holds below — but that alone is
  # INSUFFICIENT: without the honesty guard, these two cases would have
  # "succeeded" (dietary_restrictions saved, or nothing at all saved) while looking
  # like the allergy was handled, when it silently wasn't. FE-T14's
  # `refuseAllergenMentionGuard` (compose-policy-packs.ts) reads
  # resolve-and-assemble.ts's `isAllergenMentionUtterance` detector off the
  # RAW utterance and REFUSEs the whole turn honestly instead — mirroring
  # the customer-onboarding pack's own `validateAllergenExplicitArray`
  # guard's "never silently accept an unsafe allergen state" posture, one
  # seam earlier (utterance-shaped, not payload-shaped). The pt-BR refusal
  # copy redirects the customer to the explicit profile-form channel for
  # allergy changes specifically, while making clear non-allergy
  # preferences can still be updated by chat.
  - id: adversarial-allergy-alongside-dietary
    utterance: sou vegetariano e também tenho alergia a amendoim
    note: >-
      An allergy is mentioned ALONGSIDE a legitimate dietary statement.
      extractionIR still carries ONLY the dietary flag (structural
      property: no allergenExclusions/allergens key ever reaches it) — but
      the TURN as a whole REFUSEs, because silently saving "vegetariano"
      while dropping the allergy mention on the floor would be a dishonest
      partial success.
    expectPayload:
      extractionIR:
        payload:
          dietary_restrictions: [vegetariano]
        provenanceTrust:
          dietary_restrictions: untrusted
      hydratedIntentIR:
        payload:
          dietary_restrictions: [vegetariano]
        payloadPresent:
          - allergenExclusions
        provenanceTrust:
          allergenExclusions: authoritative
        confirmationRequired: false
      decision: REFUSE

  - id: adversarial-allergy-only-mention
    utterance: tenho alergia a frutos do mar, quero atualizar meu perfil
    note: >-
      An allergy is the ONLY thing mentioned — no dietary/favorite-category
      statement at all. extractionIR is empty (the allergy mention has NO
      slot on this schema, unlike order.note.add's free-text `body`) AND
      the turn REFUSEs — the honest outcome for a bare allergen-update ask
      is a clear redirect, never a silent "nothing to do" success.
    expectPayload:
      extractionIR:
        payload: {}
      hydratedIntentIR:
        payload: {}
        payloadPresent:
          - allergenExclusions
        provenanceTrust:
          allergenExclusions: authoritative
        confirmationRequired: false
      decision: REFUSE

  - id: question-form
    utterance: dá pra colocar que eu sou vegetariano nas minhas preferências?
    note: Question-form register ("dá pra...?").
    expectPayload:
      extractionIR:
        payload:
          dietary_restrictions: [vegetariano]
        provenanceTrust:
          dietary_restrictions: untrusted
      hydratedIntentIR:
        payload:
          dietary_restrictions: [vegetariano]
        payloadPresent:
          - allergenExclusions
        provenanceTrust:
          allergenExclusions: authoritative
        confirmationRequired: false

  - id: formal-solicito-both
    utterance: Solicito o registro das seguintes preferências, sou vegano e prefiro comida japonesa.
    note: Formal/bureaucratic register, BOTH fields together.
    expectPayload:
      extractionIR:
        payload:
          dietary_restrictions: [vegano]
          favorite_categories: [japonesa]
        provenanceTrust:
          dietary_restrictions: untrusted
          favorite_categories: untrusted
      hydratedIntentIR:
        payload:
          dietary_restrictions: [vegano]
          favorite_categories: [japonesa]
        payloadPresent:
          - allergenExclusions
        provenanceTrust:
          allergenExclusions: authoritative
        confirmationRequired: false
