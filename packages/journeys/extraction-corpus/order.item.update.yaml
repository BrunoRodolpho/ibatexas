# order.item.update — FE-T14. Ordinary cart quantity edits — see
# order.item.add.yaml's header for why every case avoids the amend-
# preference-correction.ts existing-order markers ("carrinho" language
# only, never "pedido").
#
# Hydration: `itemId` is resolved from the model's NL `item` reference
# against the LIVE CART's line items (FE-T14's `resolveCartLineItem`,
# resolve-and-assemble.ts) — authoritative, not a guess. `item` and
# `quantity` are BOTH required on this schema.
capability: order.item.update
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
plane: customer
cases:
  - id: muda-quantidade-basic
    utterance: muda a quantidade da coca pra 2
    note: Canonical shape (the schema's own worked example) — direct register.
    expectPayload:
      extractionIR:
        payload:
          item: coca
          quantity: 2
        provenanceTrust:
          item: untrusted
          quantity: untrusted
      hydratedIntentIR:
        payload:
          item: coca
          quantity: 2
        payloadPresent:
          - cartId
          - itemId
        provenanceTrust:
          cartId: authoritative
          itemId: authoritative
        confirmationRequired: false

  - id: formal-altere
    utterance: Por favor, altere a quantidade do hambúrguer no carrinho para 3.
    note: Formal register.
    expectPayload:
      extractionIR:
