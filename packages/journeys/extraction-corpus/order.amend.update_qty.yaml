# order.amend.update_qty — FE-T14 BACKFILL. See order.amend.add_item.yaml's
# header for the full rationale (FE-T09 authored the schema, never grew a
# corpus; N≈10 low-risk-tier sizing; every utterance uses an EXPLICIT
# existing-order marker so amend-preference-correction.ts's BKL-154
# re-route fires unconditionally).
#
# Hydration (audit-metadata.ts's deriveGranularAmend, ORDER_AMEND_UPDATE_QTY_
# RESOLVER_FIELDS = [orderId, itemId]): orderId is grounded (auto-resolved
# "most recent order" guess); itemId is resolved via resolveOrderLineItem
# (a LIVE placed-order line-item title match against the model's NL `item`
# reference) — authoritative (an explicit-reference resolution, not a
# guess). Both `item` and `quantity` are REQUIRED on this schema (unlike
# order.amend.add_item's optional quantity) — every case below states both.
# Only presence is asserted for itemId (its concrete Medusa line-item id is
# seed/run-dependent), never its value.
capability: order.amend.update_qty
source: tickets/language-engine/issues/14-rollout-convenience-mutating-verbs.md
cases:
  - id: meu-pedido-basic
    utterance: muda a quantidade da coca pra duas no meu pedido
    note: >-
      Canonical shape — the `meuPedido` explicit marker, direct register,
      new quantity 2.
    expectPayload:
      extractionIR:
        payload:
          item: coca
          quantity: 2
        provenanceTrust:
          item: untrusted
          quantity: untrusted
      hydratedIntentIR:
        payload:
          item: coca
          quantity: 2
        payloadPresent:
          - orderId
          - itemId
        provenanceTrust:
          orderId: grounded
          itemId: authoritative
        confirmationRequired: true

