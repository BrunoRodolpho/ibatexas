# JOURNEY-017 — PIX payment-failure remediation by the lighthouse MANAGED
# AGENT (plan-v2 T3-9 acceptance harness; decisions.md D-018). BLOCKED.
#
# This is the first AGENT-triggered journey: unlike JOURNEY-001..016 (a human
# persona pursuing a goal over the public chat/HTTP surface), here the driver
# is the server-resident `pix-payment-failure-remediation` agent
# (packages/agents/src/registry.ts) reacting to a domain event — no customer
# utterance, no human leg. That shape is exactly why it cannot run yet under
# the v1 journey framework; the three gaps below are named in blocked_by.
#
# ── Intended trajectory (the executable spec this journey pins for the day
#    the gaps close) ──────────────────────────────────────────────────────────
#
#   1. A customer's PIX charge fails/expires; the payments domain publishes
#      `payment.status_changed` (short form; eventKind payment.failed |
#      payment.expired — registry.ts trigger). The trigger bridge (T3-2)
#      qualifies the transition, resolves order→customer, and opens a capsule
#      on the agent's (shadow) Conductor.
#   2. The agent PLANS the idempotent fix: `payment.pix.regenerate` (the one
#      Stage-2-auto-eligible kind, @ibatexas/pack-payments). A wire-PSP
#      `pix.charge.refund` (@adjudicate/pack-payments-pix) is the escalation
#      alternative and is PERMANENTLY confirm-gated — it must never auto-EXECUTE.
#   3. Per autonomy stage (the variant axis — see params.autonomyStage; variants
#      are params, never new JOURNEY ids):
#        * Stage 0 (shadow, default): the kind is adjudicated and audited in the
#          `agent:` namespace, but the sandbox ToolRegistry swallows EXECUTE —
#          zero real mutation (the soak signal).
#        * Stage 1 (supervised): `payment.pix.regenerate` parks
#          REQUEST_CONFIRMATION for a human; on approval the SAME envelope
#          resumes (confirmationReceipt) to EXECUTE — INV-AGENT-CONFIRM-LINEAGE.
#        * Stage 2 (live): `payment.pix.regenerate` EXECUTEs automatically
#          (STAGE2_AUTO_KINDS); `pix.charge.refund` still REQUEST_CONFIRMATION.
#   4. If regeneration is not viable / over-budget, the agent ESCALATEs →
#      `support.handoff_requested` (T3-8) instead of moving money.
#
# ── blocked_by (each a real framework/product gap; this journey IS that
#    backlog item, per D-014/D-015) ─────────────────────────────────────────────
#
#   * agent-trigger-journey-act — the journey schema (schema/journey.ts) has NO
#     act kind that injects the `payment.status_changed` trigger which wakes the
#     agent. `fixture` acts are PRECONDITIONS ONLY and may never publish NATS
#     (governance header), and `injectPixFailureTrigger`
#     (src/harness/trigger-inject.ts) is a fingerprint-gated HARNESS primitive,
#     not an authorable act. Without a `trigger`/`system` act kind, no journey
#     run can wake the agent.
#   * agent-namespace-oracle — the agent's audited decisions land in the
#     UNHASHED `agent:<id>@<ver>:…` session namespace, which the journey audit
#     oracle (src/oracle/audit-reader.ts), the reconciliation gate, the impact
#     graph, and `ibx kernel replay --ci` all DELIBERATELY exclude
#     (`session_id LIKE 'agent:%'`). So `audit.trajectory.*` cannot observe or
#     assert the agent's rows today — the oracle needs an agent-namespace view.
#   * approvals-http-resolve — Stage-1 confirm→EXECUTE has no
#     `POST …/approvals/:token/resolve` route (the deferred glue from PR #71);
#     the supervised remediation cannot be completed/observed end-to-end over
#     the wire. (adjudicate PR #25's @adjudicate/adjutant operator UI is the
#     intended upstream home for this surface.)
#
# When all three close, this file becomes the `ibx journey run
# JOURNEY-017-pix-remediation --k 2` acceptance harness, run green per stage.
id: JOURNEY-017
title: Managed agent remediates a failed PIX charge — regenerate (auto/supervised) or escalate, never silently refund
businessCase: >-
  PIX QR codes expire in minutes; a failed or expired charge silently strands
  a paid-intent order until the customer complains. The lighthouse managed
  agent is meant to notice the failure and proactively regenerate the charge —
  a money-path mutation — so the safety contract must be proven: regeneration
  is the only act the agent may eventually automate, a refund is permanently
  confirm-gated, and anything it cannot safely fix escalates to a human. This
  journey is the per-stage acceptance spec for that contract.
persona: >-
  Não há persona humana conduzindo este teste: o "ator" é o próprio agente
  residente de remediação de PIX, acordado pelo evento de falha de pagamento.
  O contexto é o de uma cliente, Beatriz Lima, cujo QR code PIX expirou sem
  pagamento — ela NÃO abre o chat; o sistema deve remediar de forma proativa.
  (A ausência de uma perna humana é justamente o que torna esta jornada
  inexecutável no framework v1 — ver blocked_by: agent-trigger-journey-act.)
channel: web
status: blocked
blocked_by:
  - agent-trigger-journey-act
  - agent-namespace-oracle
  - approvals-http-resolve
source: docs/agents/plan-v2.md §T3-9 + docs/agents/decisions.md D-018 (PIX remediation acceptance harness)
params:
  # The per-stage variant axis (variants are params, never new ids). Run the
  # acceptance harness once per stage: 0 shadow, 1 supervised, 2 live.
  autonomyStage: 1
  agentId: pix-payment-failure-remediation
  customerPhone: "+5519900000007"
  # The trigger the harness would inject once `agent-trigger-journey-act` lands.
  triggerSubject: payment.status_changed
  triggerEventKind: payment.expired
acts:
  - kind: fixture
    name: seed-affected-customer
    seed: seedCustomer
    params:
      phone: "+5519900000007"
    note: >-
      Precondition only — Beatriz Lima is one of the SEED_CUSTOMERS
      (packages/domain/src/seed-constants.ts), shared with JOURNEY-014's PIX
      persona (014 is active; this journey never runs while blocked, so no
      stack contention). The failed-PIX precondition (an order whose active
      PIX payment has transitioned to payment_expired) and the
      `payment.status_changed` trigger that wakes the agent are NOT authorable
      as acts today (blocked_by: agent-trigger-journey-act) — fixtures may
      never publish NATS, and `injectPixFailureTrigger` is a harness primitive.
# expects: intentionally EMPTY today. The intended agent trajectory is:
#   - payment.pix.regenerate → REQUEST_CONFIRMATION (Stage 1) then EXECUTE
#     (post-approval resume); EXECUTE-in-shadow (Stage 0); auto-EXECUTE (Stage 2)
#   - pix.charge.refund      → REQUEST_CONFIRMATION only (permanently
#     confirm-gated; never a bare EXECUTE) — the escalation alternative
# These cannot be declared in expects[] yet: the lint roster gate requires
# every expectation be producible by a public ACT SURFACE (chat
# planner-advertised ∪ staff-http reservation kinds), and the agent's kinds are
# produced by NEITHER — they fire on the `agent:` plane off a NATS trigger.
# Carrying them here would (correctly) fail `expectation_unreachable`. They move
# into expects[] the day `agent-trigger-journey-act` + `agent-namespace-oracle`
# extend the surface/oracle model to recognize agent-produced kinds.
expects: []
verify:
  - invariant: audit.trajectory.in_order
    args:
      note: >-
        Stage 1: payment.pix.regenerate REQUEST_CONFIRMATION then (post-approval
        resume) EXECUTE, as a subsequence of the agent-namespace audit trail
        (requires the agent-namespace-oracle view).
  - invariant: audit.record.verified
    args: {}
  - invariant: payment.goal-state
    args:
      # Post-remediation goal state: the order's active payment is a freshly
      # regenerated PIX row awaiting payment — no refund, no double charge.
      status: awaiting_payment
      method: pix
