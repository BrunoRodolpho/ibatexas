# JOURNEY-002 — authenticated amend of a just-placed order (plan §5 T1a-12;
# corrected to the executable trajectory AND re-statused BLOCKED by T1b-0,
# per D-014 — the amend executor is dead against Medusa v2, see gap below).
#
# ── T1b-0 LIVE VERDICT (2026-06-12, two k=2 attempts on the real stack):
#    `order.amend.request` is GENUINELY UNDRIVABLE on every public surface —
#    NEW product gap `medusa-v2-order-edit-api`:
#
#    * The amend executor's add/update_qty paths (packages/tools/src/cart/
#      amend-order.ts:274/:283/:292 and :397/:406/:415) and the remove path
#      (OrderService.cancelItem, packages/domain/src/services/
#      order.service.ts:297-318) drive the Medusa V1 order-edit API —
#      POST /admin/orders/:id/edits → .../items → .../confirm. Medusa v2
#      REMOVED those routes; the live stack answers
#      `404 Cannot POST /admin/orders/<id>/edits` on every attempt (v2's
#      flow is /admin/order-edits + draft-order confirmation semantics).
#      Customer-facing amend has been dead since the Medusa v2 migration:
#      every add/update/remove returns "Erro ao …" + needsEscalation.
#    * The breakage is INVISIBLE to status-level asserts: the route
#      (order-actions.ts:888) maps the executor's {success:false} to HTTP
#      200 after the kernel already audited `order.amend.request EXECUTE` —
#      decision EXECUTE, zero state change. Only the goal-state oracle
#      (order.goal-state containsItemHandle over the Medusa line items —
#      implemented by T1b-0 for exactly this) catches it: both live
#      attempts FAILED with "farofa-de-bacon-defumado not among the order's
#      Medusa line items [brisket-americano]" while trajectory,
#      tamper-evidence and reconciliation all PASSED.
#    * Unblock requirement: port amendOrder + OrderService.cancelItem to the
#      Medusa v2 order-edit API (or an equivalent kernel-adjudicated v2
#      flow), then re-status this journey active — the rest of the
#      trajectory below is live-verified.
#
# ── T1b-0 CORRECTIONS retained as the executable spec for unblock day
#    (everything below EXCEPT the final amend mutation verified live):
#
#  1. CHAT ORDER-ASSEMBLY IS NOT EXECUTABLE (product gap `chat-order-assembly`,
#     pinned live by T1a-13 / JOURNEY-001 header correction 1): the chat
#     planner is a single-shot semantic parser (claustrum/ibatexas-planner.ts)
#     whose payloads are free-form NL — `requireCartIdForCartOps`
#     (pack-orders policies.ts:290) REFUSEs every chat `order.item.add`
#     with `order.cart.missing` because the PAYLOAD never carries a cartId.
#     The original place-order chat leg (item.add + checkout EXECUTE via
#     chat) was structurally impossible. Order assembly runs over the
#     storefront's public HTTP API (routes/cart.ts) exactly as JOURNEY-001.
#
#  2. CHAT AMEND CANNOT EXECUTE — but its REFUSAL is real, deterministic,
#     and live-verified (both attempts: REFUSE `order.not_found`, basis
#     state:transition_illegal). `order.amend.request` IS planner-advertised
#     when authenticated (pack-orders capabilities.ts) and the persona's ask
#     DOES reach the kernel — but amend is NOT in ORDER_AUTORESOLVE_KINDS
#     (resolve-and-assemble.ts:419: only order.cancel +
#     payment.pix.regenerate auto-resolve), so with no explicit id in the
#     payload `requireOrderIdForMutation` (policies.ts:343) REFUSEs.
#     Even with an id, the executor (amendOrder) demands a schema-valid
#     `{orderId, action, variantId}` the planner cannot synthesize
#     (readToolCalls never executed — D-014). The chat leg asserts the
#     audited REFUSE (the chat-order-assembly gap, amend facet); the
#     amendment completes through the documented public route
#     POST /api/orders/:id/amend (order-actions.ts:791: requireAuth +
#     ownership + 5/10min rate limit; kernel EXECUTE via
#     requireOrderIdForMutation on route-built ctx.orderId, requireAmendable
#     pre-cancel, executeAmend).
#
# Decision-trajectory derivation (IN_ORDER over the run's hashed audit
# namespaces — D-012; all three steps OBSERVED live, see verdict):
#   * order.checkout.create — EXECUTE (http; hashed(customerId) namespace).
#   * order.amend.request — REFUSE (chat; hashed(chat sessionId) namespace;
#     the goal text forbids quoting any id so the payload cannot carry one;
#     re-asks may re-REFUSE — tuple-matching tolerates the extras).
#   * order.amend.request — EXECUTE (http completion; hashed(customerId)).
#
# Reconciliation allowances (T1b-1): the single-shot planner may map the
# amend ask onto a cart op instead — `order.cart.ensure` EXECUTEs for any
# persona (no cartId required; executeCartOps) and `order.item.add` REFUSEs
# `order.cart.missing` — both declared `optional: true` (unused in both live
# attempts; kept for nightly robustness). The http amend executor's inner
# Medusa order-edit envelopes are system-actor rows in per-event
# sourceSubject namespaces (outside the run's fetch scope — JOURNEY-001
# header); the cash order has no Stripe PI, so no payment-row swap occurs.
#
# Rate-limit budget (D-014 discipline): POST /api/orders/:id/amend is
# limited 5/10min per customer (rk rate:amend:<customerId>) — at most TWO
# k=2 validation runs against the same stack per 10-minute window.
id: JOURNEY-002
title: Authenticated customer amends a just-placed order (chat refusal pinned, HTTP completion)
businessCase: >-
  Customers routinely forget a side dish right after checking out. Amend is
  the difference between "cancel everything and start over" and a one-turn
  fix. Today the conversational amend is REFUSED by the kernel (the chat
  planner cannot bind the order id — chat-order-assembly gap) AND the HTTP
  amend executor is dead against Medusa v2 (medusa-v2-order-edit-api gap):
  the amend feature does not work for any customer. This journey is the
  executable spec waiting on the executor fix, and its blocked status IS
  the product backlog entry.
persona: >-
  João Santos, cliente autenticado, fecha um pedido de brisket para retirada
  e percebe em seguida que esqueceu a farofa — tenta adicionar a farofa ao
  MESMO pedido pelo chat e, como o atendimento não consegue concluir,
  finaliza a alteração pelo site.
channel: web
status: blocked
blocked_by:
  - medusa-v2-order-edit-api
source: docs/agents/plan-v2.md §5 T1a-12 (corrected + re-statused by T1b-0 per D-014)
params:
  authenticated: true
  customerPhone: "+5519900000002"
  productHandle: brisket-americano
  amendProductHandle: farofa-de-bacon-defumado
  paymentMethod: cash
  fulfillment: pickup
acts:
  - kind: fixture
    name: seed-authenticated-customer
    seed: seedCustomer
    params:
      phone: "+5519900000002"
    note: >-
      Precondition only — João Santos is one of the SEED_CUSTOMERS
      (packages/domain/src/seed-constants.ts); resolved via the read-only
      oracle role; the authFixture mints his customer JWT cookie.
  - kind: fixture
    name: resolve-brisket-variant
    seed: resolveProductVariant
    params:
      handle: brisket-americano
      variantTitle: 400g
    note: >-
      Precondition only — read-only catalog resolve (handle + variant title
      -> variantId) so the journey file never carries a raw Medusa id.
  - kind: http
    name: create-cart
    method: POST
    path: /api/cart
    asRole: customer
    body: {}
    capture:
      cartId: cart.id
    note: >-
      Storefront cart-create; audits as the medusa.cart.create system
      envelope (gateway namespace, outside the run scope).
  - kind: http
    name: add-brisket
    method: POST
    path: /api/cart/:cartId/line-items
    asRole: customer
    body:
      variant_id: ":variantId"
      quantity: 1
    note: >-
      Storefront item-add (medusa.cart.line_items.add system envelope).
      order.item.add EXECUTE is producible by NO public surface today —
      JOURNEY-001 header correction 1.
  - kind: http
    name: checkout
    method: POST
    path: /api/cart/checkout
    asRole: customer
    body:
      cartId: ":cartId"
      paymentMethod: cash
      deliveryType: pickup
    note: >-
      The money commitment: order.checkout.create EXECUTE (user envelope in
      the customer audit namespace).
  - kind: chat
    name: amend-via-chat-refused
    goal: >-
      Pedir, pelo chat, para ADICIONAR uma porção de farofa de bacon
      defumado ao pedido que você ACABOU de fechar. Deixe claro que o pedido
      JÁ FOI FINALIZADO — não é para criar um pedido novo nem mexer no
      carrinho, é uma ALTERAÇÃO do pedido existente. NUNCA informe número,
      código ou ID de pedido — se o agente pedir, diga que não sabe o número
      e que é o seu pedido MAIS RECENTE. Envie no máximo 2 mensagens ao todo
      e então encerre a conversa, independentemente da resposta (a alteração
      será concluída por outro canal).
    note: >-
      Asserts the audited REFUSE only (header correction 2): with no id in
      the utterance the planner cannot put an orderId in the payload, amend
      is never auto-resolved, and requireOrderIdForMutation REFUSEs —
      live-verified refusal code order.not_found. The responder may answer
      anything; the REFUSE AUDIT ROW is this act's deliverable, asserted by
      verify[], never by reply text.
  - kind: fixture
    name: resolve-farofa-variant
    seed: resolveProductVariant
    params:
      handle: farofa-de-bacon-defumado
      variantTitle: Porção
    note: >-
      Re-resolves ctx.vars.variantId to the amend item (sequential acts —
      the brisket add already consumed the previous value).
  - kind: http
    name: amend-via-http
    method: POST
    path: /api/orders/:orderId/amend
    asRole: customer
    body:
      action: add
      variantId: ":variantId"
      quantity: 1
    note: >-
      The documented public amend round-trip (order-actions.ts:791):
      :orderId resolves to the run's own order via the projection barrier;
      requireAuth cookie; kernel order.amend.request EXECUTE. BLOCKING GAP:
      the executor then drives the Medusa V1 order-edit API, which v2
      removed (live 404) — and the route answers 200 {success:false}, so
      order.goal-state containsItemHandle is the load-bearing assert that
      keeps this journey honest (header verdict).
expects:
  - intentKind: order.checkout.create
    decision: EXECUTE
  - intentKind: order.amend.request
    decision: REFUSE
  - intentKind: order.amend.request
    decision: EXECUTE
  # T1b-1 reconciliation allowances — the single-shot planner may map the
  # amend ask onto cart ops instead (see header). Observed-but-not-asserted;
  # tolerated absent; never trajectory requirements, never coverage claims.
  - intentKind: order.cart.ensure
    decision: EXECUTE
    optional: true
  - intentKind: order.item.add
    decision: REFUSE
    optional: true
verify:
  - invariant: audit.trajectory.in_order
    args:
      note: expects[] as a subsequence of the run-sessionId audit namespaces
  - invariant: audit.record.verified
    args: {}
  - invariant: order.goal-state
    args:
      status: pending
      containsItemHandle: farofa-de-bacon-defumado
