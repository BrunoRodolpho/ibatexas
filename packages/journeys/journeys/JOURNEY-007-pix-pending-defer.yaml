# JOURNEY-007 — PIX-pending DEFER (plan §5 T1a-12 pins
# `order.checkout.create` → DEFER via the pix-pending defer guard).
#
# Intended spec: with an in-flight, UNCONFIRMED PIX charge, a further
# checkout DEFERs on PIX_CONFIRMATION_SIGNAL instead of stacking a second
# money mutation. The guard is real and composed today:
# `createPixPendingDeferGuard` from @adjudicate/pack-payments-pix, wrapped
# as `deferOnPendingPix` inside ordersPolicyBundle.stateGuards (pack-orders
# policies.ts) — it fires only when ctx.paymentStatus is non-null and not in
# ORDER_PIX_CONFIRMED_STATUSES (D-24 Ruling 1: a FRESH pix checkout with
# paymentStatus null EXECUTEs — QR-first-then-confirm).
#
# blocked_by: web-pix-pending-ctx — DISCOVERED GAP (T1a-12 code read): the
# web surface can never present that state to the guard. Both the conductor
# chat path and the HTTP checkout route assemble checkout ctx via
# loadCartCtx/buildCartCtx (apps/api/src/claustrum/resolve-and-assemble.ts),
# which PINS `paymentStatus: null` — the in-flight-unconfirmed branch is
# reachable only on the defer-resolver resume path (WhatsApp cognitive-loop
# re-entry, apps/api/src/subscribers/defer-resolver.ts
# buildResumeOrderState), and Phase-1 journeys drive channel "web" only
# (lint check 5). Unblocking = teaching the web checkout ctx assembly to
# surface the customer's active in-flight PIX charge (and/or widening
# journeys to the whatsapp channel) — likely alongside T2-1's
# kernel-routed paid-state fixture.
id: JOURNEY-007
title: Checkout with a pending PIX charge defers until confirmation
businessCase: >-
  A customer whose PIX is still pending must not be able to pile up a second
  checkout — the kernel parks the intent on the payment-confirmation signal
  (15-minute timeout) instead of refusing or double-charging. The DEFER, not
  an error message, is the contract.
persona: >-
  Beatriz Lima, cliente autenticada, fecha um pedido pagando por PIX, demora
  para pagar o QR e — com o PIX ainda pendente — tenta fechar um segundo
  pedido na mesma conversa.
channel: web
status: blocked
blocked_by:
  - web-pix-pending-ctx
source: docs/agents/plan-v2.md §5 T1a-12 (gap discovered during authoring)
params:
  authenticated: true
  customerPhone: "+5519900000007"
  productHandle: limonada-suica
  secondProductHandle: brownie-com-sorvete
  paymentMethod: pix
  fulfillment: pickup
acts:
  - kind: fixture
    name: seed-authenticated-customer
    seed: seedCustomer
    params:
      phone: "+5519900000007"
  - kind: chat
    name: place-pix-order
    goal: >-
      Montar um pedido com duas limonadas suíças (500ml) para retirada,
      pagamento via PIX, e finalizar o pedido. NÃO pague o QR code.
  - kind: chat
    name: second-checkout-while-pix-pending
    goal: >-
      Sem pagar o PIX anterior, montar um segundo pedido com um brownie com
      sorvete e tentar finalizá-lo. A expectativa de negócio é que o
      fechamento fique aguardando a confirmação do PIX pendente.
expects:
  - intentKind: order.item.add
    decision: EXECUTE
  - intentKind: order.checkout.create
    decision: EXECUTE
  - intentKind: order.item.add
    decision: EXECUTE
  - intentKind: order.checkout.create
    decision: DEFER
verify:
  - invariant: audit.trajectory.in_order
    args:
      note: expects[] as a subsequence of the run-sessionId audit namespace
  - invariant: order.goal-state
    args:
      # Only the FIRST order exists; the deferred checkout parked, so no
      # second order row may appear.
      status: pending
