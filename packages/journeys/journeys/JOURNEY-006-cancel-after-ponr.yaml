# JOURNEY-006 — cancel after the point of no return: the NEGATIVE is the
# assertion (plan §5 T1a-12 pins `order.cancel` → REFUSE).
#
# Intended spec: once an order has passed its point of no return (here: it
# was already cancelled — a terminal state), a further cancel must surface
# as an audited kernel REFUSE (`order.already_cancelled`, basis
# {category: "state", code: "terminal_state"} — pack-orders
# requireCancellable + BASIS_CODES.state.TERMINAL_STATE), never as a
# tool-level apology with an EXECUTE on the books.
#
# blocked_by: order-cancel-kernel-ponr — the `order-cancel-kernel-ponr` KERNEL
# gap is now CLOSED (both unblock paths this header named have landed):
#   * conductor path — requireCancellable now reads the projected terminal
#     status (`orderAlreadyCancelled` = `lastAction === "cancelled" ||
#     ctx.fulfillmentStatus === "canceled"`, pack-orders policies.ts) AND the
#     fulfillment-state PONR (POST_PONR / CUSTOMER_POST_PONR sets, PR #107), so
#     the audited REFUSE (`order.already_cancelled` / `order.past_ponr`, basis
#     state/terminal_state) is now producible from the projected ctx — the old
#     `lastAction: null` pin is no longer the only signal.
#   * HTTP path — POST /api/orders/:id/cancel no longer 422s BEFORE the kernel
#     (BKL-036 finding 1): the fulfillment-state / already-cancelled cancel now
#     reaches the kernel (adjudicated + AUDITED), and the route translates the
#     kernel REFUSE back to the identical legacy 422 + code
#     (PAST_PONR / PONR_EXPIRED). Only the order-age time-window stays pre-kernel.
# RESIDUAL (why status is still `blocked`, out of THIS scope): the run is a CHAT
# journey whose expects need the first cancel to EXECUTE via a parked
# REQUEST_CONFIRMATION resumed on the chat channel — the `chat-confirmation-resume`
# gap (see JOURNEY-015 header correction 3) is unrelated to the kernel PONR gate
# and is unblocked/live-proven separately (WS9). This journey remains the pinned
# spec until that live-proof run flips it.
id: JOURNEY-006
title: Cancelling past the point of no return is kernel-REFUSED
businessCase: >-
  Money safety reads from the audit trail: when a cancel can no longer
  happen, the refusal itself must be a kernel decision with a machine-
  readable basis — support, finance and the replay gate all reason from
  intent_audit, not from chat apologies.
persona: >-
  Lucas Mendes, cliente autenticado, faz um pedido, cancela — e, distraído,
  tenta cancelar DE NOVO o mesmo pedido. O sistema precisa recusar a segunda
  tentativa de forma auditada, não apenas responder educadamente.
channel: web
status: blocked
blocked_by:
  - order-cancel-kernel-ponr
source: docs/agents/plan-v2.md §5 T1a-12 (gap discovered during authoring)
params:
  authenticated: true
  customerPhone: "+5519900000006"
  productHandle: smash-burger-defumado
  paymentMethod: cash
  fulfillment: pickup
acts:
  - kind: fixture
    name: seed-authenticated-customer
    seed: seedCustomer
    params:
      phone: "+5519900000006"
  - kind: chat
    name: place-order
    goal: >-
      Montar um pedido com um smash burger defumado para retirada, pagamento
      em dinheiro, e finalizar o pedido.
  - kind: chat
    name: cancel-order
    goal: >-
      Cancelar o pedido recém-criado sem citar número do pedido; quando o
      agente pedir confirmação, responda "sim".
  - kind: chat
    name: cancel-again-past-ponr
    goal: >-
      Tentar cancelar o MESMO pedido outra vez ("cancela meu pedido de
      novo"). A expectativa de negócio é uma recusa explícita: o pedido já
      está cancelado.
expects:
  - intentKind: order.item.add
    decision: EXECUTE
  - intentKind: order.checkout.create
    decision: EXECUTE
  - intentKind: order.cancel
    decision: REQUEST_CONFIRMATION
  - intentKind: order.cancel
    decision: EXECUTE
  - intentKind: order.cancel
    decision: REFUSE
verify:
  - invariant: audit.trajectory.in_order
    args:
      note: expects[] as a subsequence of the run-sessionId audit namespace
  - invariant: audit.refusal-basis
    args:
      intentKind: order.cancel
      refusalCode: order.already_cancelled
      basis:
        category: state
        code: terminal_state
  - invariant: order.goal-state
    args:
      status: canceled
