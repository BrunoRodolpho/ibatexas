# JOURNEY-005 — delivery→pickup conversion of an in-flight order
# (plan §5 T1a-12; corrected to the executable trajectory by T1b-0, per
# D-014).
#
# ── T1b-0 CORRECTIONS (executable-spec principle):
#
#  1. CHAT ORDER-ASSEMBLY IS NOT EXECUTABLE (product gap
#     `chat-order-assembly` — JOURNEY-001 header correction 1): the original
#     place-delivery-order chat leg expected order.item.add +
#     order.checkout.create EXECUTE via chat; `requireCartIdForCartOps`
#     (pack-orders policies.ts:290) REFUSEs every chat item-add
#     (`order.cart.missing` — the planner payload never carries a cartId)
#     and no public surface produces order.item.add EXECUTE today. Order
#     assembly runs over the storefront's public HTTP API (routes/cart.ts),
#     with the DELIVERY slot driven by `deliveryCep` — create-checkout.ts:223
#     derives metadata.deliveryType = deliveryCep ? "delivery" : "pickup",
#     so the CEP (Ana's seeded address, packages/domain/src/seed-delivery.ts
#     — 14815000, inside the seeded Ibaté delivery zone) is what makes this
#     order a DELIVERY order.
#
#  2. NO CHAT LEG REMAINS: the conversion kind `order.type.switch` is not
#     planner-advertised (pack-orders capabilities.ts allowedIntents — it is
#     a W5 route-only kind) and not in CHAT_DRIVABLE_TOOL_KINDS, has no
#     resolver leg and no confirm gate; chat can neither propose nor park
#     it, and with order assembly also HTTP-only (correction 1) no leg of
#     this story is genuinely chat-drivable today. The journey is the
#     suite's documented all-HTTP case until chat-order-assembly ships.
#
# Decision-trajectory derivation (IN_ORDER over the run's hashed audit
# namespaces — D-012; all rows in hashed(customerId)):
#   * order.checkout.create — EXECUTE (cash + delivery: route checks only
#     restrict shipping/dine_in; requireSlotsFilledForCheckout sees
#     fulfillment=delivery from the request's deliveryType — T1a-13 fix in
#     routes/cart.ts:1049).
#   * order.type.switch — EXECUTE via PATCH /api/orders/:id/type
#     (order-actions.ts:1562): requireAuth + ownership route-side; the route
#     collapses pickup→`takeout` for the pack envelope while carrying
#     httpVocab=pickup; kernel: requireOrderIdForMutation ✓ (route-built
#     ctx.orderId), executeW5Kinds → EXECUTE; the inner switchOrderType tool
#     enforces the 5-min PONR (canPerformAction) — a just-placed order is
#     well inside — and updates the projection's delivery_type to "pickup"
#     synchronously (switchTypeFromEnvelope). Its inner envelope lands in
#     hashed("api") (apiContext sessionId — outside the run scope), so no
#     reconciliation allowance is needed; cash→pickup forces no payment
#     swap.
#
# Coverage note: with no chat act this journey claims no matrix cells —
# both expects are reported under `unmatchedExpects` by design (public-http
# kinds are outside the DR-5 cell domain). The original file's chat cells
# (order.item.add/order.checkout.create EXECUTE) were never executable;
# baseline regenerated by T1b-0 (the documented mechanism).
id: JOURNEY-005
title: Customer converts an in-flight delivery order to pickup
businessCase: >-
  Delivery windows slip; customers near the restaurant convert to pickup to
  save the fee and the wait. The conversion must respect the kitchen's point
  of no return and be kernel-audited with both the policy vocabulary
  (takeout) and what the customer actually asked for (pickup).
persona: >-
  Ana Oliveira, cliente autenticada, fecha um pedido para ENTREGA em casa,
  mas percebe que vai passar em frente ao restaurante — converte o pedido em
  andamento para RETIRADA no balcão.
channel: web
status: active
blocked_by: []
source: docs/agents/plan-v2.md §5 T1a-12 (corrected by T1b-0 per D-014)
params:
  authenticated: true
  customerPhone: "+5519900000003"
  productHandle: costela-bovina-defumada
  paymentMethod: cash
  fulfillmentInitial: delivery
  fulfillmentFinal: pickup
acts:
  - kind: fixture
    name: seed-authenticated-customer
    seed: seedCustomer
    params:
      phone: "+5519900000003"
    note: >-
      Ana Oliveira is a SEED_CUSTOMER with a seeded delivery address in the
      Ibaté zone (packages/domain/src/seed-delivery.ts, CEP 14815000) — the
      checkout act's deliveryCep below is that seeded address's CEP.
  - kind: fixture
    name: resolve-product-variant
    seed: resolveProductVariant
    params:
      handle: costela-bovina-defumada
      variantTitle: 1kg
    note: >-
      Precondition only — read-only catalog resolve (handle + variant title
      -> variantId); the journey file never carries a raw Medusa id.
  - kind: http
    name: create-cart
    method: POST
    path: /api/cart
    asRole: customer
    body: {}
    capture:
      cartId: cart.id
    note: >-
      Storefront cart-create; audits as medusa.cart.create (gateway
      namespace, outside the run scope).
  - kind: http
    name: add-item
    method: POST
    path: /api/cart/:cartId/line-items
    asRole: customer
    body:
      variant_id: ":variantId"
      quantity: 1
    note: >-
      Storefront item-add (medusa.cart.line_items.add system envelope) —
      header correction 1.
  - kind: http
    name: checkout-delivery
    method: POST
    path: /api/cart/checkout
    asRole: customer
    body:
      cartId: ":cartId"
      paymentMethod: cash
      deliveryType: delivery
      deliveryCep: "14815000"
    note: >-
      The money commitment as a DELIVERY order: deliveryCep (Ana's seeded
      CEP) is what create-checkout.ts:223 keys metadata.deliveryType =
      "delivery" on; the order.placed projection then carries
      delivery_type=delivery. Kernel: order.checkout.create EXECUTE.
  - kind: http
    name: convert-to-pickup
    method: PATCH
    path: /api/orders/:orderId/type
    asRole: customer
    body:
      type: pickup
    note: >-
      The documented public conversion route (order-actions.ts:1562):
      :orderId resolves to the run's own order via the projection barrier;
      ownership + 5-min PONR enforced; kernel order.type.switch EXECUTE;
      the projection's delivery_type flips to "pickup" synchronously. The
      route maps an inner-tool failure to 422, so a 200 here IS the
      conversion succeeding.
expects:
  - intentKind: order.checkout.create
    decision: EXECUTE
  - intentKind: order.type.switch
    decision: EXECUTE
verify:
  - invariant: audit.trajectory.in_order
    args:
      note: expects[] as a subsequence of the run-sessionId audit namespaces
  - invariant: audit.record.verified
    args: {}
  - invariant: order.goal-state
    args:
      status: pending
      orderType: pickup
