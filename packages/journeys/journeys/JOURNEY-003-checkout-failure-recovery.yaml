# JOURNEY-003 — checkout-failure recovery (BLOCKED — plan §5 T1a-12).
#
# Intended trajectory (the executable spec this journey pins for the day the
# gaps close): a large-ticket chat checkout (>= R$1.000 —
# CONFIRM_LARGE_TICKET_THRESHOLD_CENTAVOS, pack-orders types.ts) parks on
# REQUEST_CONFIRMATION (confirmLargeTicket); the customer confirms in the
# SAME conversation and the parked envelope resumes to EXECUTE; if the
# resume/payment leg fails, the agent escalates to a human (HandoffPort).
#
# blocked_by (both named by the plan):
#   * handoff-port-noop — the ESCALATE → human handoff channel is a no-op
#     until T3-8 wires HandoffPort to the T3-7 notification channel.
#   * chat-confirmation-resume — the web chat surface cannot resume the
#     checkout confirmation the way the web HTTP flow can
#     (POST /api/cart/checkout parks a confirmationId resumable only via
#     POST /api/cart/checkout/confirm — cart.ts; there is no chat bridge to
#     that store). Per the plan, T3-8 closes ONLY the former; NO phase closes
#     the confirmation-resume product gap — this journey stays blocked until
#     product fixes it.
id: JOURNEY-003
title: Checkout failure recovery — confirm-parked large ticket resumed in chat
businessCase: >-
  Large-ticket orders deliberately park on a confirmation so a mis-parsed
  total can never auto-execute. The business needs the RECOVERY side proven:
  the customer must be able to complete (or be handed to a human for) the
  parked checkout without abandoning the conversation — today that recovery
  path is a product gap.
persona: >-
  Carlos Pereira, cliente autenticado, monta uma encomenda grande de costelas
  congeladas para um evento da firma (acima de R$1.000), recebe o pedido de
  confirmação do valor e quer concluir a compra na mesma conversa — e, se o
  fechamento falhar, ser atendido por uma pessoa.
channel: web
status: blocked
blocked_by:
  - handoff-port-noop
  - chat-confirmation-resume
source: docs/agents/plan-v2.md §5 T1a-12 (+ §"product gaps")
params:
  authenticated: true
  customerPhone: "+5519900000004"
  productHandle: costela-defumada-congelada
  quantity: 12
  paymentMethod: cash
  fulfillment: pickup
acts:
  - kind: fixture
    name: seed-authenticated-customer
    seed: seedCustomer
    params:
      phone: "+5519900000004"
  - kind: chat
    name: large-ticket-checkout
    goal: >-
      Montar uma encomenda de 12 costelas defumadas congeladas (1kg família)
      para retirada, pagamento em dinheiro, e finalizar o pedido. Quando o
      agente pedir confirmação do valor total, responda "sim" para concluir.
expects:
  - intentKind: order.checkout.create
    decision: REQUEST_CONFIRMATION
  - intentKind: order.checkout.create
    decision: EXECUTE
verify:
  - invariant: audit.trajectory.in_order
    args:
      note: expects[] as a subsequence of the run-sessionId audit namespace
  - invariant: order.goal-state
    args:
      status: pending
