# JOURNEY-016 — large-ticket money governance: checkout parks at
# REQUEST_CONFIRMATION, the documented confirm round-trip resumes it to
# EXECUTE, and the cancel of the committed R$1.000+ order ESCALATEs to a
# human (plan §5 T2-2b — "pick the most valuable EXECUTABLE story the
# matrix lacks").
#
# ── WHY THIS STORY (T2-2b cell-value justification):
#
#  The coverage matrix had NO ESCALATE cell and NO confirm-RESUME path
#  anywhere: JOURNEY-001 pins the confirm GATE (the park) but its resume is
#  blocked (chat-confirmation-resume), and every other confirm/escalate
#  band (refunds, disputes, waive) sits behind staff routes or system-only
#  taint. The large-ticket band is the ONE executable end-to-end confirm
#  loop the SUT ships today — POST /api/cart/checkout/confirm is the only
#  confirm round-trip surface in the product (JOURNEY-001 header) and had
#  never been exercised by a journey. The escalated cancel
#  (escalateLargeCancel, pack-orders policies.ts:582 — customer cancel >=
#  R$1.000 → ESCALATE to human) is a first-class money-safety cell: big
#  cancellations are refund-equivalent and must reach a human, audited,
#  never auto-unwound.
#
# ── T2-2b AUTHORING FACTS (executable-spec principle, D-014/D-015):
#
#  1. THE CHECKOUT RC ROW SURVIVES AS AN UNLINKED SIBLING (LIVE-OBSERVED,
#     2026-06-12): the confirm route rebuilds the IDENTICAL envelope (same
#     payload + deterministic `${cartId}:checkout` nonce → same intentHash,
#     routes/cart.ts:1221) with a confirmationReceipt and the kernel
#     substitutes EXECUTE — but the resumed EXECUTE record carries NO
#     `supersedes` link back to the awaiting RC record, and the upstream
#     chain walker (`buildSupersessionChains`, @adjudicate/audit) links by
#     EXPLICIT supersedes stamps only, never by intentHash equality. So
#     chain resolution drops nothing here: the trail shows BOTH rows as
#     singletons sharing one intentHash. The RC is declared `optional:
#     true` (it must be EXPLAINED for reconciliation — live runs confirm
#     the allowance fires — but the trajectory must not require an
#     intermediate that a future supersedes-stamping fix WOULD drop);
#     optional entries claim no coverage cell, so the RC behaviour is
#     pinned act-level: the 202 + confirmationId capture IS the park.
#     OBSERVATIONAL GAP `checkout-confirm-supersedes-link`: the web
#     confirm-resume path leaves the confirm lineage unlinked in
#     intent_audit — Phase 3's INV-AGENT-CONFIRM-LINEAGE (DR-6 supersession
#     chain provenance) will need the gateway to stamp `supersedes` on the
#     receipt-resumed record.
#
#  2. ESCALATE SURFACES AS HTTP 503 (customer-intent-gateway.ts decision
#     map: REFUSE 403 / DEFER 202 / REQUEST_CONFIRMATION 202 / ESCALATE
#     503), so the cancel act pins `expectStatus: 503` — the T2-2b harness
#     extension that makes correct-non-2xx routes drivable as positive
#     specs (the same mechanism JOURNEY-008's 400-probe needs when its
#     ingress gap closes). The kernel row is the assert; the 503 is the
#     act-level evidence that NO cancellation happened.
#
#  3. CHAT CANNOT PRODUCE THE ESCALATE: an id-less chat cancel auto-resolves
#     and the adopter confirmOnAutoResolveGuard (prepended to business,
#     compose-policy-packs.ts:92) fires BEFORE the pack's
#     escalateLargeCancel — REQUEST_CONFIRMATION wins. The chat leg
#     therefore pins exactly that (the confirm gate also guards big-money
#     cancels conversationally), and the ESCALATE needs the explicit-id
#     HTTP route (no auto-resolve flag → confirm guard passes → escalate
#     guard reads ctx.totalInCentavos from the REAL projection,
#     order-actions.ts:484).
#
#  4. Thresholds (pack-orders types.ts): confirmLargeTicket >= R$1.000
#     (CONFIRM_LARGE_TICKET_THRESHOLD_CENTAVOS = 100_000) on checkout;
#     escalateLargeCancel >= R$1.000 on cancel; refuseAmountAboveCap >=
#     R$10.000. Cart: 7 × costela bovina defumada 1kg (16500 centavos) =
#     115_500 centavos (R$1.155,00) — inside the confirm/escalate band,
#     far from the hard cap.
#
# Decision-trajectory derivation (run-namespace rows, D-012 hashing):
#   * order.checkout.create — REQUEST_CONFIRMATION (the park; optional
#     allowance — header fact 1) then EXECUTE (the confirm-route resume),
#     both hashed(customerId) namespace.
#   * order.cancel — REQUEST_CONFIRMATION (chat, hashed chat sessionId).
#   * order.cancel — ESCALATE (cancel route, hashed(customerId); the
#     escalate decision runs no executor, so no inner transition rows).
id: JOURNEY-016
title: Large order confirms before commit and its cancellation escalates to a human
businessCase: >-
  Money governance at scale: a R$1.155 order must not commit on a single
  click — the kernel parks it and the customer explicitly confirms through
  the documented round-trip (the product's only working confirm-resume
  surface). Once committed, that much money cannot be silently unwound
  either: the cancel escalates to a human agent as an audited kernel
  decision. Finance and support read both halves from intent_audit — the
  confirm lineage (RC superseded by its receipt-resumed EXECUTE) and the
  ESCALATE row.
persona: >-
  Pedro Rocha, cliente autenticado, faz o pedido do churrasco da firma —
  sete quilos de costela defumada — confirma o valor alto quando o site
  pede, e logo depois tenta cancelar tudo; o cancelamento de um pedido
  desse tamanho precisa passar por um atendente humano.
channel: web
status: active
blocked_by: []
source: docs/agents/plan-v2.md §5 T2-2b (matrix-gap pick — confirm resume + ESCALATE cells)
params:
  authenticated: true
  customerPhone: "+5519900000010"
  productHandle: costela-bovina-defumada
  variantTitle: 1kg
  quantity: 7
  totalInCentavos: 115500
  paymentMethod: cash
  fulfillment: pickup
acts:
  - kind: fixture
    name: seed-authenticated-customer
    seed: seedCustomer
    params:
      phone: "+5519900000010"
    note: >-
      Precondition only — Pedro Rocha is one of the SEED_CUSTOMERS;
      resolved via the read-only oracle role. A customer no other journey
      uses: the escalated-cancel leg consumes the per-customer cancel
      rate-limit budget (D-014: 5/10min) and must never share it with
      JOURNEY-001's k=4 cancel loop.
  - kind: fixture
    name: resolve-product-variant
    seed: resolveProductVariant
    params:
      handle: costela-bovina-defumada
      variantTitle: 1kg
    note: Precondition only — read-only catalog resolve (handle + title → variantId).
  - kind: http
    name: create-cart
    method: POST
    path: /api/cart
    asRole: customer
    body: {}
    capture:
      cartId: cart.id
    note: Storefront cart-create (medusa.cart.create gateway namespace).
  - kind: http
    name: add-seven-costelas
    method: POST
    path: /api/cart/:cartId/line-items
    asRole: customer
    body:
      variant_id: ":variantId"
      quantity: 7
    note: >-
      7 × 16500 = 115500 centavos (R$1.155,00) — crosses the R$1.000
      confirm/escalate band without approaching the R$10.000 hard REFUSE
      cap (header fact 4).
  - kind: http
    name: checkout-parks-at-confirm
    method: POST
    path: /api/cart/checkout
    asRole: customer
    expectStatus: 202
    body:
      cartId: ":cartId"
      paymentMethod: cash
      deliveryType: pickup
    capture:
      confirmationId: confirmationId
    note: >-
      The confirm GATE: confirmLargeTicket parks the order.checkout.create
      (kernel RC row — later superseded by the resumed EXECUTE, header fact
      1) and the route answers 202 {confirmationRequired, confirmationId,
      prompt} with the single-use resume handle (routes/cart.ts:1097). The
      pinned 202 + capture IS this act's deliverable.
  - kind: http
    name: confirm-checkout
    method: POST
    path: /api/cart/checkout/confirm
    asRole: customer
    body:
      confirmationId: ":confirmationId"
    note: >-
      The product's ONLY working confirm round-trip: consumes the
      single-use receipt, re-loads the cart FRESH, rebuilds the IDENTICAL
      envelope carrying the confirmationReceipt → kernel substitutes
      EXECUTE for the matching intentHash (every state/taint/auth guard
      still enforced) → createCheckout runs → 200. This is the run's
      money commitment.
  - kind: chat
    name: chat-cancel-parks-at-confirm
    goal: >-
      Pedir o cancelamento do pedido grande que você acabou de confirmar,
      SEM NUNCA citar número, código ou ID do pedido (ex.: "Mudou o plano
      aqui, quero cancelar o pedido da costela."). Se o agente pedir o
      número do pedido, recuse educadamente e diga que é o seu pedido MAIS
      RECENTE. Envie no máximo 2 mensagens ao todo e então encerre a
      conversa, independentemente da resposta (o cancelamento será tratado
      por outro canal).
    note: >-
      Pins header fact 3: even for a R$1.155 order, the conversational
      cancel parks at the adopter confirm gate (auto-resolved money ref →
      REQUEST_CONFIRMATION) — the escalate band is unreachable from chat by
      guard order, so no money moves from a conversation. RC row asserted
      by verify[]; re-asks may re-park (same declared tuple).
  - kind: http
    name: cancel-escalates
    method: POST
    path: /api/orders/:orderId/cancel
    asRole: customer
    expectStatus: 503
    body:
      reason: "Cancelamento de pedido grande — teste de governança"
    note: >-
      The ESCALATE: explicit order id (run-own order via the projection
      barrier) → confirm guard passes (no auto-resolve flag) →
      escalateLargeCancel reads the projection total (115500 >= 100000) →
      kernel ESCALATE to human → gateway 503 "Operação requer atendimento
      humano." (header fact 2). No executor runs: the order is NOT
      cancelled — exactly the contract. Consumes 1 of the 5/10min cancel
      rate-limit slots for this customer (k=2 fits comfortably).
expects:
  - intentKind: order.checkout.create
    decision: EXECUTE
  - intentKind: order.cancel
    decision: REQUEST_CONFIRMATION
  - intentKind: order.cancel
    decision: ESCALATE
  # Confirm-park allowance (header fact 1, live-observed): the checkout's
  # awaiting-RC row survives chain resolution (no supersedes stamp on the
  # gateway resume path) and must be EXPLAINED — but a future
  # supersedes-stamping fix would drop it, so it may not be a trajectory
  # requirement. Optional entries claim no coverage.
  - intentKind: order.checkout.create
    decision: REQUEST_CONFIRMATION
    optional: true
verify:
  - invariant: audit.trajectory.in_order
    args:
      note: >-
        resumed checkout EXECUTE → chat cancel RC → route cancel ESCALATE,
        as a subsequence of the run's hashed namespaces (customerId + chat
        session) after supersession resolution
  - invariant: audit.record.verified
    args: {}
  - invariant: order.goal-state
    args:
      # Neither cancel half moved money: the chat RC parked unresumable and
      # the ESCALATE ran no executor — the committed order stays pending.
      status: pending
  - invariant: payment.goal-state
    args:
      # The active cash payment survives both cancel attempts untouched.
      status: cash_pending
      method: cash
