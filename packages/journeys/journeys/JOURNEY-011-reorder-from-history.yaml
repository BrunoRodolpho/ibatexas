# JOURNEY-011 — reorder from history: "pedir de novo" (plan §5 T2-2a).
#
# ── T2-2a AUTHORING CORRECTIONS (executable-spec principle, D-014/D-015):
#
#  1. CHAT REORDER IS NOT EXECUTABLE TODAY: `order.reorder` is registered
#     (KNOWN_INTENT_KINDS) but NEVER planner-advertised and NOT in
#     CHAT_DRIVABLE_TOOL_KINDS (the `reorder` tool is a multi-envelope
#     orchestration with no single-intent map — pack-orders
#     capabilities.ts:88), and no public HTTP route produces it — the kind
#     is currently producible by NO public surface. The conversational
#     "pedir de novo" leg therefore lands on the planner's always-advertised
#     cart op: an explicit item-add ask yields `order.item.add` with a
#     free-form NL payload → `requireCartIdForCartOps` REFUSEs
#     `order.cart.missing` (chat-order-assembly product gap — JOURNEY-001
#     header correction 1; JOURNEY-009 pinned the same negative on the
#     guest surface, this journey pins it on the AUTHED surface where the
#     read tool get_order_history is even visible-but-never-executed).
#
#  2. THE REORDER ASSEMBLY IS STOREFRONT-HTTP (the JOURNEY-001 model): the
#     harness resolves the customer's SEEDED order history
#     (ibx_domain.customer_order_items — `ibx test seed` seed-orders) for
#     the pinned handle via the read-only `resolveHistoricalOrderItem`
#     fixture, proving the history precondition AND surfacing the HISTORICAL
#     variantId; the re-order then runs cart → line-items → checkout over
#     routes/cart.ts. The goal-state assert closes the loop: the NEW order
#     contains exactly the historical product (containsItemHandle).
#
# Decision-trajectory derivation (IN_ORDER over hashed(chat session) +
# hashed(customerId) — D-012):
#   * order.item.add — REFUSE (`order.cart.missing`): pack-orders
#     policies.ts:290, payload-level cartId guard; deterministic for every
#     chat item-add (the planner payload never carries a cartId).
#   * order.checkout.create — EXECUTE: cash + pickup, single-EXECUTE kernel
#     trajectory (no PIX defer, no large-ticket confirm) — the JOURNEY-001
#     verified derivation.
#   * order.cart.ensure — EXECUTE tolerated (`optional`): the planner may
#     propose a cart-ensure en route (executable for any persona — not in
#     CART_OPS_REQUIRING_CART_ID). Allowance only, never asserted (the
#     JOURNEY-009 precedent).
id: JOURNEY-011
title: Returning customer reorders a past favorite — chat proposes, the storefront assembles
businessCase: >-
  Repeat purchases are the cheapest revenue: a returning customer wants
  "the same as last time" without rebuilding the basket. Today the chat can
  understand the ask but cannot assemble it (no read-tool execution, no
  payload synthesis — the chat-order-assembly gap, pinned here as the
  audited REFUSE), so the storefront completes the reorder from the
  customer's REAL seeded history, and the new order must contain exactly
  the product he bought before — kernel-audited end to end.
persona: >-
  João Santos, cliente autenticado e comprador recorrente de congelados,
  quer pedir DE NOVO o pulled pork congelado do último pedido. Tenta pelo
  chat primeiro; como o atendimento não conclui, fecha o mesmo pedido pela
  loja no site, para retirar no balcão e pagar em dinheiro.
channel: web
status: active
blocked_by: []
source: docs/agents/plan-v2.md §5 T2-2a
params:
  authenticated: true
  customerPhone: "+5519900000002"
  productHandle: pulled-pork-congelado
  paymentMethod: cash
  fulfillment: pickup
acts:
  - kind: fixture
    name: seed-authenticated-customer
    seed: seedCustomer
    params:
      phone: "+5519900000002"
    note: >-
      Precondition only — João Santos is one of the SEED_CUSTOMERS; the
      seed-orders step gives him real order history (seed-order-hist-04/05,
      packages/domain/src/seed-orders.ts), which is the whole point of this
      journey.
  - kind: fixture
    name: resolve-historical-order-item
    seed: resolveHistoricalOrderItem
    params:
      handle: pulled-pork-congelado
    note: >-
      Precondition only — read-only resolve of João's most recent SEEDED
      history row for the pinned handle (customer_order_items joined to the
      Medusa catalog). Fails loudly if the history precondition is unmet;
      surfaces the HISTORICAL variantId so the re-order assembles exactly
      what he bought before (seed-order-hist-05, 300g).
  - kind: chat
    name: chat-reorder-attempt
    goal: >-
      Diga que quer pedir DE NOVO o mesmo do seu último pedido e peça
      EXPLICITAMENTE para ADICIONAR o pulled pork congelado ao pedido
      (ex.: "Quero pedir de novo o pulled pork congelado do meu último
      pedido — pode adicionar?"). NÃO peça para fechar o pedido; NUNCA cite
      números, códigos ou IDs. Se o agente disser que não conseguiu ou pedir
      detalhes, insista UMA vez. Envie no máximo 2 mensagens ao todo e então
      encerre a conversa, independentemente da resposta (o pedido será
      concluído por outro canal).
    note: >-
      Pins the chat-order-assembly gap on the AUTHED surface: the explicit
      item-add ask makes the planner propose order.item.add, whose NL
      payload carries no cartId → kernel REFUSE order.cart.missing — THE
      pinned row, asserted by verify[], not reply text. The persona never
      asks to close the order so no checkout envelope is legitimately
      produced via chat in this run.
  - kind: http
    name: create-cart
    method: POST
    path: /api/cart
    asRole: customer
    body: {}
    capture:
      cartId: cart.id
    note: >-
      Storefront cart-create (medusa.cart.create system envelope — gateway
      namespace, outside the run scope).
  - kind: http
    name: add-historical-item
    method: POST
    path: /api/cart/:cartId/line-items
    asRole: customer
    body:
      variant_id: ":variantId"
      quantity: 1
    note: >-
      The reorder: :variantId is the HISTORICAL variant resolved from João's
      seeded history (act 2) — the storefront's item-add is the only
      executable order-assembly surface today (JOURNEY-001 header
      correction 1).
  - kind: http
    name: checkout
    method: POST
    path: /api/cart/checkout
    asRole: customer
    body:
      cartId: ":cartId"
      paymentMethod: cash
      deliveryType: pickup
    note: >-
      The money commitment: order.checkout.create EXECUTE (user envelope in
      the hashed(customerId) namespace). Cash + pickup keeps the kernel
      trajectory to a single EXECUTE.
expects:
  - intentKind: order.item.add
    decision: REFUSE
  - intentKind: order.checkout.create
    decision: EXECUTE
  # T1b-1 reconciliation allowance — the planner may propose a cart-ensure
  # en route (executable for authed personas too). Tolerated absent; never
  # asserted; never a coverage claim.
  - intentKind: order.cart.ensure
    decision: EXECUTE
    optional: true
verify:
  - invariant: audit.trajectory.in_order
    args:
      note: >-
        chat REFUSE then the storefront checkout EXECUTE, as a subsequence
        of the run's merged hashed namespaces
  - invariant: audit.record.verified
    args: {}
  - invariant: order.goal-state
    args:
      status: pending
      containsItemHandle: pulled-pork-congelado
