# JOURNEY-008 — forged-actor HTTP probe (plan §5 T1a-12 pins 400
# `forgery_attempt` + a system-actor REFUSE audit record).
#
# The assertable contract — read from
# apps/api/src/routes/__shared__/customer-intent-gateway.ts (P2-6/P2-7):
#   * HTTP reply: 400 with body
#       { error: "Requisição inválida.", code: "forgery_attempt" }
#     (FORGERY_REJECTION_CODE; detectForgery fires when actor.principal !==
#     "user" OR taint !== "UNTRUSTED").
#   * Audit trail: emitForgeryAudit re-stamps the rejection as a
#     SYSTEM-actor record so the trail is tamper-evident, NOT minted under
#     the customer's identity:
#       envelope.kind             = "<originalKind>.forgery_rejected"
#       envelope.actor.principal  = "system"
#       envelope.actor.sessionId  = "customer-intent-gateway:<route>:<customerId>"
#       envelope.taint            = "SYSTEM"
#       decision                  = REFUSE
#       decision.refusal          = { kind: "SECURITY", code: "forgery_attempt",
#                                     userFacing: "Requisição inválida.",
#                                     detail: "forged actor.principal=system" }
#       decision.basis            = []
#     Note `<originalKind>.forgery_rejected` is deliberately NOT in
#     KNOWN_INTENT_KINDS, so it cannot be expressed in expects[] — the
#     audit-side assertion lives in verify[] (audit.refusal-basis args
#     below). expects[] carries only the legitimate order placement that
#     gives the probe its target; the probe itself may contribute NO
#     customer-kind decision (audit.kind-absent counts order.cancel).
#
# blocked_by: envelope-ingress-gap — DISCOVERED GAP (T1a-12 code read): no
# public route accepts a caller-supplied IntentEnvelope. Every customer
# route builds its own envelope via buildCustomerEnvelope, which
# STRUCTURALLY excludes actor/taint from caller input (the compile-time
# P2-6/P2-7 defense), and Fastify zod body schemas strip unknown fields —
# so an HTTP probe today cannot reach detectForgery at all (the runtime
# defense is exercised only by unit tests,
# routes/__tests__/customer-mutation-governance.test.ts). Unblocking needs a
# test-plane envelope ingress with JWT-helper-grade containment (the T3-9
# allowlisted-helper pattern: fingerprint-gated + named check-bypass leg).
id: JOURNEY-008
title: Forged system-actor envelope is rejected 400 with a tamper-evident trail
businessCase: >-
  The customer HTTP surface must never launder a system-actor or
  trusted-taint envelope: a forged probe has to bounce with a stable error
  code AND leave a system-actor REFUSE record in the audit trail, so an
  attack attempt is observable evidence rather than a silent 4xx.
persona: >-
  Um atacante (ou uma rota com bug) envia ao endpoint de cancelamento um
  envelope de intenção com actor.principal "system" e taint "TRUSTED",
  tentando se passar pelo próprio sistema para cancelar um pedido.
#
# RESOLVED (C2): the envelope-ingress-gap is CLOSED. A test-plane-only ingress
# route now exists — apps/api/src/routes/test-envelope-ingress.ts
# (POST /api/test/envelope-ingress, hard-gated by IBX_TEST_FINGERPRINT) — which
# hands a raw, caller-controlled envelope straight to runCustomerIntent so a
# forged actor/taint reaches detectForgery. The full contract (400
# `forgery_attempt` + a tamper-evident SYSTEM-actor `<kind>.forgery_rejected`
# REFUSE audit record) is proven by apps/api/src/routes/__tests__/
# test-envelope-ingress.test.ts. Remaining: a journey-runner act that POSTs a
# raw envelope to drive this via `ibx journey run` (harness nicety, not a
# product/defense gap).
channel: web
status: blocked
blocked_by:
  - journey-runner-raw-envelope-act   # was: envelope-ingress-gap (CLOSED — see C2 note above)
source: docs/agents/plan-v2.md §5 T1a-12 (gap discovered during authoring)
params:
  authenticated: true
  customerPhone: "+5519900000008"
  productHandle: mandioca-frita
  paymentMethod: cash
  fulfillment: pickup
  forgedKind: order.cancel
acts:
  - kind: fixture
    name: seed-authenticated-customer
    seed: seedCustomer
    params:
      phone: "+5519900000008"
  - kind: chat
    name: place-target-order
    goal: >-
      Montar um pedido com uma mandioca frita para retirada, pagamento em
      dinheiro, e finalizar o pedido. Esse pedido será o alvo da sonda.
  - kind: http
    name: forged-actor-probe
    method: POST
    path: /api/orders/:orderId/cancel
    asRole: customer
    body:
      kind: order.cancel
      payload:
        orderId: ":orderId"
        reason: "forjado"
      nonce: forged-nonce-journey-008
      actor:
        principal: system
        sessionId: "forged:system"
      taint: TRUSTED
    note: >-
      The probe POSTs a customer-intent envelope whose actor/taint are
      forged. Expected (once an envelope ingress exists): HTTP 400 with
      code "forgery_attempt" and NO order mutation.
expects:
  - intentKind: order.item.add
    decision: EXECUTE
  - intentKind: order.checkout.create
    decision: EXECUTE
verify:
  - invariant: audit.refusal-basis
    args:
      # The system-actor rejection record per customer-intent-gateway.ts
      # emitForgeryAudit (kind suffix ".forgery_rejected" on the forged
      # kind; refusal kind SECURITY; empty basis[] by construction).
      auditKind: order.cancel.forgery_rejected
      actorPrincipal: system
      taint: SYSTEM
      refusalKind: SECURITY
      refusalCode: forgery_attempt
      detail: "forged actor.principal=system"
      basis: []
  - invariant: audit.kind-absent
    args:
      # The forged customer kind itself must never be adjudicated.
      intentKind: order.cancel
  - invariant: order.goal-state
    args:
      # The probed order is untouched.
      status: pending
