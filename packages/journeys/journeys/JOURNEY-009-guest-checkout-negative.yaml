# JOURNEY-009 — guest negative: checkout is NOT proposable (plan §5
# T1a-12; corrected to the executable trajectory by T1b-0, per D-014).
#
# ── T1b-0 CORRECTIONS (executable-spec principle):
#
#  1. THE GUEST CART CANNOT BE BUILT VIA CHAT (product gap
#     `chat-order-assembly` — JOURNEY-001 header correction 1): the original
#     expects claimed `order.item.add EXECUTE` from the guest chat leg, but
#     `requireCartIdForCartOps` (pack-orders policies.ts:290) REFUSEs every
#     chat item-add with `order.cart.missing` — the single-shot planner's
#     payload never carries a cartId (and even past that guard,
#     requireExplicitAllergens would REFUSE the NL payload). The guest cart
#     is now built over the storefront's public HTTP API (routes/cart.ts,
#     optionalAuth — guest mode), whose 2xx + cartId capture is the
#     non-vacuity evidence; the chat leg's item-add becomes the audited
#     REFUSE this journey now PINS (the chat-order-assembly gap as an
#     executable negative on the guest surface).
#
#  2. cart.goal-state DROPPED (was: containsProductHandles): the storefront
#     cart rows audit as medusa.cart.* SYSTEM envelopes in per-event
#     sourceSubject namespaces — structurally OUTSIDE the run's hashed
#     session scope (JOURNEY-001 header) — so the T1b-1 reconciliation gate
#     correctly rejects a state assert with no in-scope EXECUTE/REWRITE
#     (`fixture_forged_assertion`). The cart-built evidence is act-level:
#     each line-items POST must 2xx against the captured cartId.
#
# Code basis for the negative (unchanged): chat guests get customerId null
# and the orders planner advertises order.checkout.create / order.cancel /
# order.amend.request ONLY when isAuthenticated (pack-orders
# capabilities.ts) — the SUT's LLM can never even PROPOSE a guest checkout
# envelope: nothing reaches the kernel, nothing is audited. The
# deterministic negative is audit-side ABSENCE, not a refusal.
#
# Decision-trajectory derivation (IN_ORDER over the guest chat session's
# hashed namespace — D-012; no customer namespace exists in this run):
#   * order.item.add — REFUSE (`order.cart.missing`): the planner advertises
#     item.add to guests (always-proposable cart ops), the persona
#     explicitly asks to add items, and the payload-level cartId guard
#     refuses deterministically. THE pinned row.
#   * order.cart.ensure — EXECUTE tolerated (`optional`): not in
#     CART_OPS_REQUIRING_CART_ID, executeCartOps EXECUTEs it for any
#     persona — the planner may propose it en route. Allowance only.
#
# Assertion choices (stated per the task):
#   * LOAD-BEARING + DETERMINISTIC: `audit.kind-absent` — no
#     order.checkout.create envelope may appear in this run's audit scope;
#     plus the required chat `order.item.add REFUSE` row (trajectory) and
#     tamper-evidence over the observed rows.
#   * ADVISORY ONLY (llm-judge-excluded): "the reply steers the guest to
#     log in" is fuzzy text — deliberately NOT a verify[] entry (LLM-judge
#     assertions never gate merges); documented on the act note for
#     human/driver-trace review only.
id: JOURNEY-009
title: Guest builds a cart on the storefront — chat checkout is structurally not proposable
businessCase: >-
  Guests may shop, but money mutations require an authenticated identity.
  The business needs this pinned as a NEGATIVE: no conversation steering may
  ever produce a guest checkout envelope — the planner surface, not a
  refusal message, is the control. The same run pins the chat-order-assembly
  gap on the guest surface: a conversational item-add is kernel-REFUSED.
persona: >-
  Visitante sem cadastro e sem login navega pelo cardápio no site, monta um
  carrinho com bebida e sobremesa e tenta fechar o pedido pelo chat,
  insistindo um pouco quando o agente orienta a entrar na conta.
channel: web
status: active
blocked_by: []
source: docs/agents/plan-v2.md §5 T1a-12 (corrected by T1b-0 per D-014)
params:
  productHandle: limonada-suica
  secondProductHandle: brownie-com-sorvete
acts:
  - kind: fixture
    name: resolve-limonada-variant
    seed: resolveProductVariant
    params:
      handle: limonada-suica
      variantTitle: 500ml
    note: >-
      Precondition only — read-only catalog resolve; the journey file never
      carries a raw Medusa id.
  - kind: http
    name: create-guest-cart
    method: POST
    path: /api/cart
    body: {}
    capture:
      cartId: cart.id
    note: >-
      Anonymous storefront cart-create (optionalAuth — guest mode); audits
      as medusa.cart.create in the gateway namespace (outside the run
      scope). The captured cartId is the cart-built evidence anchor.
  - kind: http
    name: add-limonada
    method: POST
    path: /api/cart/:cartId/line-items
    body:
      variant_id: ":variantId"
      quantity: 1
    note: >-
      Guest item-add over the public surface — the 2xx IS the assert
      (header correction 2).
  - kind: fixture
    name: resolve-brownie-variant
    seed: resolveProductVariant
    params:
      handle: brownie-com-sorvete
      variantTitle: Porção
    note: >-
      Re-resolves ctx.vars.variantId to the second item (sequential acts).
  - kind: http
    name: add-brownie
    method: POST
    path: /api/cart/:cartId/line-items
    body:
      variant_id: ":variantId"
      quantity: 1
  - kind: chat
    name: guest-chat-add-and-checkout-attempt
    goal: >-
      Sem fazer login, peça pelo chat para ADICIONAR uma limonada suíça ao
      seu pedido e então tente FECHAR o pedido pelo chat. Se o agente
      orientar a entrar na conta ou criar cadastro, insista UMA vez ("não dá
      para fechar mesmo assim?"). Envie no máximo 3 mensagens ao todo e
      então encerre a conversa, independentemente da resposta.
    note: >-
      Two pinned behaviors in one leg: (a) the conversational item-add is
      kernel-REFUSED (order.cart.missing — chat-order-assembly gap, asserted
      via the trajectory), and (b) no checkout envelope can exist
      (audit.kind-absent). ADVISORY (not a verify entry): the reply should
      steer the guest to authenticate and must not offer to complete the
      checkout itself.
expects:
  - intentKind: order.item.add
    decision: REFUSE
  # T1b-1 reconciliation allowance — the planner may propose a cart-ensure
  # en route (executable for guests). Tolerated absent; never asserted;
  # never a coverage claim.
  - intentKind: order.cart.ensure
    decision: EXECUTE
    optional: true
verify:
  - invariant: audit.trajectory.in_order
    args:
      note: the required order.item.add REFUSE row, in the guest chat namespace
  - invariant: audit.record.verified
    args: {}
  - invariant: audit.kind-absent
    args:
      intentKind: order.checkout.create
