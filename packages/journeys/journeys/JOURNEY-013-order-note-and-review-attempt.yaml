# JOURNEY-013 — order note via chat + review attempt (plan §5 T2-2a),
# REWORKED 2026-07-19 (BKL-172): both original chat pins went stale as the
# product moved under them — this revision re-pins the CURRENT contracts.
#
# ── T2-2a AUTHORING CORRECTIONS, RECALIBRATED (executable-spec principle,
#    D-014/D-015 — each stale pin cites the PR that moved it):
#
#  1. CHAT NOTE-ADD NOW BINDS ITS TARGET — the original pin (kernel REFUSE
#     `order.not_found`: no NL→id auto-resolve leg for order.note.add) was
#     CLOSED by PR #220 (BKL-038): order.note.add is in
#     ORDER_AUTORESOLVE_KINDS (resolve-and-assemble.ts), so a conversational
#     note for "my most recent order" (no id quoted — customers don't know
#     ids) auto-resolves the customer's most-recent order and flags
#     `ctx.autoResolvedMoneyRef`. The adopter `confirmOnAutoResolveGuard`
#     (compose-policy-packs.ts AUTORESOLVE_CONFIRM_KINDS — order.note.add is
#     a member) then PARKS it: the audited chat row is
#     REQUEST_CONFIRMATION, not REFUSE. The park stays chat-unresumable
#     (chat-confirmation-resume, the JOURNEY-001/014 precedent — BKL-033
#     still open), so the RC row IS the deliverable and the persona is
#     instructed NOT to confirm (deterministic terminal, the JOURNEY-014
#     idiom).
#
#  2. THE NOTE EXECUTES OVER THE DOCUMENTED PUBLIC ROUTE (unchanged): POST
#     /api/orders/:id/notes (order-actions.ts) — requireAuth + route-side
#     ownership, kernel order.note.add EXECUTE via addNoteFromEnvelope with
#     getAuditSink() injected. ROUTE QUIRK (recorded): the route passes
#     `customer:${customerId}` as the envelope's customerId, so the EXECUTE
#     row lands in the hashed(`customer:<id>`) namespace, NOT
#     hashed(customerId) like the cancel route — this journey declares
#     params.auditScopeCustomerTool: true so the harness scopes that
#     namespace into the run (T2-2a harness extension).
#
#  3. REVIEW-SUBMIT IS NOW ADVERTISED — the original negative (planner
#     surface control: order.review.submit registered-but-unadvertised, so
#     the chat ask produced NO envelope and the pin was audit-side ABSENCE)
#     was CLOSED by PR #305 (FE-D28: order.review.submit end-to-end chat
#     wiring + activation). The orders planner now advertises it to
#     authenticated customers; the resolver stamps the Identity-class
#     orderId + productId (order-note-review.schema.ts exposes only
#     rating/comment + NL refs), and order.review.submit is ALSO in
#     AUTORESOLVE_CONFIRM_KINDS — the customer sees the resolved order +
#     product before a public review posts. The chat review ask therefore
#     now REACHES the kernel and parks: REQUEST_CONFIRMATION replaces the
#     old `audit.kind-absent` pin (same unconfirmed-terminal discipline as
#     correction 1). The kind's coverage stance moves from
#     waived-unadvertised to RC-covered-by-chat.
#
# Decision-trajectory derivation (IN_ORDER over hashed(chat session) +
# hashed(customerId) + hashed(`customer:<id>`) — D-012 + correction 2):
#   * order.checkout.create — EXECUTE (storefront assembly, cash + pickup —
#     the JOURNEY-001 verified derivation).
#   * order.note.add — REQUEST_CONFIRMATION via chat (auto-resolved
#     most-recent order; correction 1). Re-asks may re-park — extra RC rows
#     share the declared tuple (tuple-level reconciliation) and IN_ORDER
#     tolerates them.
#   * order.review.submit — REQUEST_CONFIRMATION via chat (FE-D28;
#     correction 3). Never confirmed in this run.
#   * order.note.add — EXECUTE via the public route (correction 2); 201 +
#     the audited row; the note row itself is route-confirmed (the response
#     carries the persisted content).
id: JOURNEY-013
title: Customer asks for an order note in chat (parked for confirmation), completes it on the site — review-by-chat parks the same way
businessCase: >-
  Kitchen notes are an allergy-adjacent safety surface ("sem cebola") — the
  business needs them kernel-audited whichever surface carries them. Chat now
  binds the target order (auto-resolve, PR #220) but parks behind the
  explicit-confirmation gate before mutating (pinned here as the audited
  REQUEST_CONFIRMATION); the public route completes it; and the same run pins
  that a chat review ask reaches the kernel and parks behind the SAME gate
  (FE-D28, PR #305) — no unconfirmed auto-resolved reference ever mutates or
  posts a public review.
persona: >-
  Carlos Pereira, cliente autenticado, acabou de fechar um pedido de
  costela para retirada e quer avisar a cozinha: sem cebola na farofa.
  Tenta pelo chat; depois registra a observação pela conta no site. No
  embalo, tenta deixar uma avaliação 5 estrelas pelo chat.
channel: web
status: active
blocked_by: []
source: docs/agents/plan-v2.md §5 T2-2a
params:
  authenticated: true
  customerPhone: "+5519900000004"
  productHandle: costela-bovina-defumada
  paymentMethod: cash
  fulfillment: pickup
  auditScopeCustomerTool: true
acts:
  - kind: fixture
    name: seed-authenticated-customer
    seed: seedCustomer
    params:
      phone: "+5519900000004"
    note: >-
      Precondition only — Carlos Pereira is one of the SEED_CUSTOMERS;
      resolved via the read-only oracle role.
  - kind: fixture
    name: resolve-product-variant
    seed: resolveProductVariant
    params:
      handle: costela-bovina-defumada
      variantTitle: 1kg
  - kind: http
    name: create-cart
    method: POST
    path: /api/cart
    asRole: customer
    body: {}
    capture:
      cartId: cart.id
  - kind: http
    name: add-item
    method: POST
    path: /api/cart/:cartId/line-items
    asRole: customer
    body:
      variant_id: ":variantId"
      quantity: 1
  - kind: http
    name: checkout
    method: POST
    path: /api/cart/checkout
    asRole: customer
    body:
      cartId: ":cartId"
      paymentMethod: cash
      deliveryType: pickup
    note: >-
      The run's order (order.checkout.create EXECUTE, hashed(customerId)
      namespace) — the note's target.
  - kind: chat
    name: chat-note-and-review-attempt
    goal: >-
      Primeiro peça EXPLICITAMENTE para ADICIONAR uma observação ao pedido
      que você acabou de fazer: "sem cebola na farofa" (ex.: "Acabei de
      fazer um pedido — pode adicionar a observação 'sem cebola na farofa',
      por favor?"). NUNCA cite números, códigos ou IDs do pedido; se o
      agente pedir o número, diga que é o seu pedido MAIS RECENTE. Se o
      agente pedir CONFIRMAÇÃO, NÃO confirme — não diga "sim"; siga para a
      próxima mensagem. Depois, em outra mensagem, peça para deixar uma
      AVALIAÇÃO 5 estrelas do restaurante pelo chat; novamente, se pedirem
      confirmação, NÃO confirme. Envie no máximo 3 mensagens ao todo e
      então encerre a conversa, independentemente das respostas (a
      observação será registrada por outro canal).
    note: >-
      Two pinned behaviors in one leg: (a) the conversational note-add
      auto-resolves the most-recent order and PARKS —
      REQUEST_CONFIRMATION, asserted via the trajectory, never by reply
      text (correction 1; the park is chat-unresumable, so not confirming
      keeps the terminal deterministic); (b) the review ask now reaches
      the kernel and parks behind the SAME gate (FE-D28 — correction 3).
      ADVISORY only (llm-judge-excluded): the reply should surface the
      confirmation ask in pt-BR.
  - kind: http
    name: add-note-via-route
    method: POST
    path: /api/orders/:orderId/notes
    asRole: customer
    body:
      content: "Sem cebola na farofa, por favor."
    note: >-
      The documented public note route (order-actions.ts): :orderId
      resolves to the run's own order via the projection barrier;
      ownership + kernel order.note.add EXECUTE (audited in the
      hashed(customer:<id>) namespace — header correction 2). The 201
      response echoes the persisted note content.
expects:
  - intentKind: order.checkout.create
    decision: EXECUTE
  - intentKind: order.note.add
    decision: REQUEST_CONFIRMATION
  - intentKind: order.review.submit
    decision: REQUEST_CONFIRMATION
  - intentKind: order.note.add
    decision: EXECUTE
verify:
  - invariant: audit.trajectory.in_order
    args:
      note: >-
        checkout EXECUTE, chat note REQUEST_CONFIRMATION, chat review
        REQUEST_CONFIRMATION, route note EXECUTE — a subsequence of the
        run's merged hashed namespaces
  - invariant: audit.record.verified
    args: {}
