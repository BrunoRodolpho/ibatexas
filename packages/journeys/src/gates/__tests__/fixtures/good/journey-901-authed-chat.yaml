# Lint-gate GOOD fixture — authenticated chat journey, must lint green.
# Fixture ids live in the JOURNEY-9xx range so they never collide with the
# real registry (JOURNEY-001…009, T1a-12).
id: JOURNEY-901
title: Lint fixture — authenticated customer builds a cart and checks out
businessCase: Gate fixture; a clean authenticated chat journey must pass every lint check.
persona: Cliente autenticado que quer jantar costela defumada no sábado.
channel: web
params:
  authenticated: true
  productHandle: costela-bovina-defumada
acts:
  - kind: fixture
    seed: seedCustomer
    params:
      phone: "+5511999990001"
  - kind: chat
    goal: Adicionar uma costela bovina defumada ao carrinho e finalizar o pedido.
  - kind: http
    method: GET
    path: /api/me
    asRole: customer
expects:
  - intentKind: order.item.add
    decision: EXECUTE
  - intentKind: order.checkout.create
    decision: EXECUTE
verify:
  - invariant: order.goal-state
    args:
      status: pending
  - invariant: cart.goal-state
    args:
      productHandle: costela-bovina-defumada
status: active
source: T1a-2 lint-gate fixture
