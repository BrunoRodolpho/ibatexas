# AUDIT-FIX: INFRA-04 — Production Docker Compose for all services
# Usage: docker compose -f docker-compose.prod.yml up --build
#
# Requires a .env file with all production secrets.
# See .env.example for the full list of variables.

services:

  # ── Application services ──────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ibatexas-api
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 9000
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ibatexas-web
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: ibatexas-admin
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3002
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Infrastructure services ───────────────────────────────────────────────

  postgres:
    # DOCKERDRIFT: aligned to dev docker-compose.yml. pgvector/pgvector:pg17 =
    # Postgres 17 + the pgvector extension (claustrum_grounding_docs needs
    # `CREATE EXTENSION vector`; stock postgres fails with "extension not available").
    # ⚠️ Major version compatibility: the PGDATA dir is NOT binary-compatible across
    # major versions — an existing v15 volume must be migrated (pg_upgrade or
    # dump+restore) BEFORE starting v17. Do NOT point v17 at a v15 data volume.
    # (Managed Postgres — Supabase/RDS — enables pgvector differently; this image
    # only matters when self-hosting Postgres via this compose file.)
    image: pgvector/pgvector:pg17
    container_name: ibatexas-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: ibatexas-redis
    # AUDIT-FIX: INFRA-12 — Require password for Redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme-in-production}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme-in-production}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  typesense:
    # DOCKERDRIFT: aligned to dev docker-compose.yml (was 0.25.2). ⚠️ Major
    # version jump (0.25→27): the on-disk data layout differs — an existing 0.25
    # data volume must be re-indexed (rebuild the collection from source) under
    # 27.x. Do NOT reuse the old volume in place.
    image: typesense/typesense:27.1
    container_name: ibatexas-typesense
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/8108' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  nats:
    # DOCKERDRIFT: aligned to dev docker-compose.yml (was 2.10-alpine). Minor
    # bump (2.10→2.11) — wire-compatible, no data migration needed.
    image: nats:2.11-alpine
    container_name: ibatexas-nats
    command: ["--jetstream", "--store_dir", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4222 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
  typesense_data:
  nats_data:
