# Observability stack — VictoriaLogs + VictoriaMetrics + Grafana.
#
# Brought up by the `observability` process in process-compose.yaml
#   docker compose -f docker-compose.observability.yml up -d --wait
# Kept separate from the app infra (docker-compose.yml) so the obs stack can
# cycle independently and `ibx dev start --no-docker` can skip both.
#
# Data flow:
#   api (:3001/metrics, token-gated) ──scrape──▶ VictoriaMetrics (:8428)
#   api pino logs ──ship──▶ VictoriaLogs (:9428)   (via VICTORIALOGS_URL)
#   Grafana (:3030) ──reads──▶ VictoriaMetrics (provisioned datasource + dashboards)
#
# The api runs on the HOST (process-compose), not in this compose network, so
# VictoriaMetrics reaches it through the host-gateway alias (extra_hosts below).

services:
  victorialogs:
    image: victoriametrics/victoria-logs:v1.0.0-victorialogs
    container_name: ibatexas-victorialogs
    networks: [obs]
    command:
      - "-storageDataPath=/vlogs"
      - "-httpListenAddr=:9428"
      - "-retentionPeriod=7d"
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - victorialogs_data:/vlogs
    healthcheck:
      # 127.0.0.1 (not localhost): the image binds IPv4 only, busybox wget
      # resolves localhost → IPv6 ::1 → connection refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9428/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.0
    container_name: ibatexas-victoriametrics
    networks: [obs]
    command:
      - "-storageDataPath=/vmdata"
      - "-httpListenAddr=:8428"
      - "-promscrape.config=/etc/vm/scrape.yml"
      - "-retentionPeriod=7d"
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - victoriametrics_data:/vmdata
      - ./infra/victoriametrics/scrape.yml:/etc/vm/scrape.yml:ro
    extra_hosts:
      # api runs on the host; reach :3001/metrics via the host-gateway alias.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 127.0.0.1 (not localhost): the image binds IPv4 only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ibatexas-grafana
    networks: [obs]
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      # Dev-only: anonymous admin so `ibx dev` needs zero login. NEVER use this
      # posture in prod (the obs stack is local-bind 127.0.0.1 only).
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      victoriametrics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

# Dedicated network so the obs stack's lifecycle is decoupled from the app infra
# (docker-compose.yml). Previously both shared the implicit `ibatexas_default`
# network; when infra recreated it, these containers were left pinned to the old
# (deleted) network ID and failed to start with "network <id> not found".
networks:
  obs:
    name: ibatexas_obs

volumes:
  victorialogs_data:
  victoriametrics_data:
  grafana_data:
