# infra/nats/nats-server.app.conf — NATS server-side authentication (T3-10).
#
# Executes docs/security/NATS-AUTH-REQUIREMENTS.md: with this config the server
# REFUSES unauthenticated connections. One account (IBX) with the single app
# user — every IbateXas service (api, commerce, jobs/CLI publishers,
# subscribers) authenticates with the nkey SEED held client-side
# (NATS_NKEY_SEED, consumed by @ibatexas/nats-client), whose matching PUBLIC
# key is injected into this config as $NATS_APP_NKEY_PUBLIC.
#
# Consumed by (the "four surfaces" of plan-v2 T3-10, minus the test stack):
#   • docker-compose.yml                                  (local dev compose —
#     NATS_APP_NKEY_PUBLIC interpolated from .env by docker compose)
#   • docker-compose.prod.yml                             (prod compose — same
#     var from the production .env)
#   • infra/terraform/environments/dev/compose.yml.tpl    (dev-EC2 — var from
#     /opt/ibatexas/.env, populated from SSM by ibatexas-refresh-secrets; the
#     config file itself is written by user_data from THIS file via
#     templatefile in ec2.tf)
#   • infra/terraform/environments/production/nats.tf     MIRRORS this content
#     inline (ECS Fargate cannot mount a repo file; the container entrypoint
#     writes the config before exec'ing nats-server). KEEP BOTH IN SYNC.
#
# $NATS_APP_NKEY_PUBLIC is resolved by the NATS server from its process
# environment at boot; the server FAILS TO START when it is unset (fail-closed,
# on top of the compose-level ${VAR:?} guards).
#
# Generate a per-machine keypair (seed for clients, public key for this config)
# with: ./scripts/nats/gen-dev-nats-auth.sh   (appends both vars to .env —
# never share seeds across machines or environments).
#
# The journey-test stack uses nats-server.test-plane.conf instead (adds the
# subscribe-only capture user and the publish-only trigger user).

port: 4222
http_port: 8222

jetstream {
  store_dir: /data
}

accounts {
  IBX: {
    jetstream: enabled
    users: [
      # App service identity — full publish + subscribe within the account.
      { nkey: $NATS_APP_NKEY_PUBLIC }
    ]
  }
}
