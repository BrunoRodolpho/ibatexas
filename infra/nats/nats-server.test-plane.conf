# infra/nats/nats-server.test-plane.conf — journey-test stack NATS auth (T3-10).
#
# Executes docs/security/NATS-AUTH-REQUIREMENTS.md for the ephemeral test
# stack (docker-compose.test.yml): the server REFUSES unauthenticated
# connections and enforces PER-ROLE permissions for the test plane. One
# account (IBX — all three users share the subject namespace, so the capture
# can observe app-published events) with three nkey users:
#
#   1. APP ($NATS_APP_NKEY_PUBLIC ← IBX_TEST_NATS_APP_NKEY_PUBLIC):
#      the SUT services (api + commerce via process-compose, ibx CLI seeding).
#      Full publish + subscribe. Client seed: NATS_NKEY_SEED in .env.test.
#
#   2. CAPTURE ($NATS_CAPTURE_NKEY_PUBLIC ← IBX_TEST_NATS_CAPTURE_NKEY_PUBLIC):
#      the journeys oracle's NatsCapture (T1b-2, DR-2). SUBSCRIBE-ONLY —
#      `publish: deny ">"` makes the server itself reject every publish, the
#      server-side enforcement of the client-side publish-incapable wrapper
#      (packages/journeys/src/oracle/nats-capture.ts). Client seed:
#      IBX_TEST_NATS_CAPTURE_NKEY_SEED (connectNatsCapture PREFERS it over the
#      app seed that also rides the harness env).
#
#   3. TRIGGER ($NATS_TRIGGER_NKEY_PUBLIC ← IBX_TEST_NATS_TRIGGER_NKEY_PUBLIC):
#      the T3-9 single allowlisted journeys publish helper (fires agent
#      trigger events, e.g. payment.status_changed, from the acceptance
#      harness). Publish allowed on `ibatexas.>` ONLY; subscribe denied — the
#      inject plane can never observe and the observe plane can never inject,
#      by server-side construction. Client seed:
#      IBX_TEST_NATS_TRIGGER_NKEY_SEED. The helper's OTHER containment legs
#      (IBX_TEST_FINGERPRINT runtime gate + check-bypass leg 8 grep, which
#      keeps packages/journeys free of publish API calls outside the
#      sanctioned helper) are unchanged by this file.
#
# All three public keys are interpolated by the NATS server from its process
# environment (set by docker-compose.test.yml from .env.test); the server
# fails to start when any is unset. scripts/gen-env-test.sh mints all three
# per-machine keypairs.

port: 4222
http_port: 8222

jetstream {
  store_dir: /data
}

accounts {
  IBX: {
    jetstream: enabled
    users: [
      # 1. SUT app identity — full publish + subscribe.
      { nkey: $NATS_APP_NKEY_PUBLIC }

      # 2. Journeys capture — SUBSCRIBE-ONLY (server-side T1b-2 enforcement).
      { nkey: $NATS_CAPTURE_NKEY_PUBLIC, permissions: {
        subscribe: { allow: [">"] }
        publish: { deny: [">"] }
      } }

      # 3. T3-9 trigger publisher — publish ibatexas.> only, no subscribe.
      { nkey: $NATS_TRIGGER_NKEY_PUBLIC, permissions: {
        publish: { allow: ["ibatexas.>"] }
        subscribe: { deny: [">"] }
      } }
    ]
  }
}
