# VictoriaMetrics scrape config (-promscrape.config). Prometheus format + VM
# extensions (external_labels, headers). Pulls the ibatexas api /metrics
# endpoint, which is token-gated (x-prometheus-token == PROMETHEUS_TOKEN) — the
# token below MUST equal .env PROMETHEUS_TOKEN or scrapes 401.
global:
  scrape_interval: 15s
  # The api /metrics output carries NO env label; tag every scraped series with
  # env=dev so the kernel dashboards (which filter env=~"$env", default dev)
  # match. Change for staging/prod scrapers.
  external_labels:
    env: dev

scrape_configs:
  - job_name: ibatexas-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      # api runs on the host; host.docker.internal resolves via extra_hosts.
      - targets: ["host.docker.internal:3001"]
    # /metrics is token-gated — send the dev token (mirrored in .env). This is
    # real auth, not decorative: an unset/mismatched token yields 503/401.
    headers:
      - "x-prometheus-token: ibatexas-dev-prom-token"
