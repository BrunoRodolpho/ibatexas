# Grafana datasource provisioning. The uid MUST equal the dashboards'
# ${DS_PROMETHEUS} value (PBFA97CFB590B2093) so the committed kernel dashboards
# resolve their datasource without manual selection.
apiVersion: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    # In-network address (Grafana + VM share this compose network).
    url: http://victoriametrics:8428
    uid: PBFA97CFB590B2093
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
