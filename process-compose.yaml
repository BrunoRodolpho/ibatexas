version: "0.5"

environment:
  - "FORCE_COLOR=1"

env_file:
  - ".env"

log_level: info

processes:
  # ── Infrastructure (one-shot) ────────────────────────────────────────────────
  infra:
    command: "docker compose up -d --wait"
    availability:
      restart: "no"
    readiness_probe:
      exec:
        command: "docker compose ps --status running --format '{{.Name}}' | wc -l | xargs test 4 -le"
      initial_delay_seconds: 2
      period_seconds: 3
      timeout_seconds: 10
      failure_threshold: 10

  # ── Observability stack (one-shot) ──────────────────────────────────────────
  # VictoriaLogs (:9428) + VictoriaMetrics (:8428) + Grafana (:3030). Separate
  # compose file so the obs stack can be brought up/down independently of the
  # app infra. Grafana provisions the kernel dashboards against VictoriaMetrics;
  # the API publishes /metrics on :3001 (scraped via host.docker.internal).
  observability:
    command: "docker compose -f docker-compose.observability.yml up -d --wait"
    availability:
      restart: "no"
    readiness_probe:
      exec:
        command: "docker compose -f docker-compose.observability.yml ps --status running --format '{{.Name}}' | wc -l | xargs test 3 -le"
      initial_delay_seconds: 2
      period_seconds: 3
      timeout_seconds: 10
      failure_threshold: 10

  # ── Package build (one-shot) ────────────────────────────────────────────────
  # Rebuild shared packages so dist/ matches source. Dependency order matters.
  build-packages:
    # Build EVERY shared workspace package — not just types+tools — so no dev app
    # (api / web / admin / qa-viewer, all of which depend on this step) ever boots
    # against a STALE dist. Turbo is dep-graph aware (`build.dependsOn: ["^build"]`
    # in turbo.json) and content-hash cached with declared `dist/**` outputs, so
    # this is a no-op when nothing changed and rebuilds exactly what a pulled PR
    # touched. Closes the gap where a new @ibatexas/domain export (e.g. PR #206's
    # StaffMutationConflictError) was absent from a dist built before the pull,
    # crashing the api at ESM link time (`does not provide an export named …`).
    command: |
      echo "Building workspace packages (turbo, dep-graph aware)…" &&
      pnpm turbo build --filter="./packages/*" &&
      echo "Package build complete ✓"
    availability:
      restart: "no"

  # ── Admin cache cleanup (one-shot) ────────────────────────────────────────
  admin-clean:
    command: "rm -rf apps/admin/.next"
    availability:
      restart: "no"

  # ── Commerce (Medusa) ────────────────────────────────────────────────────────
  commerce:
    command: "pnpm --filter @ibatexas/commerce dev"
    depends_on:
      infra:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: "localhost"
        port: 9000
        path: "/health"
      initial_delay_seconds: 10
      period_seconds: 5
      timeout_seconds: 5
      failure_threshold: 30
    availability:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  # ── API (Fastify) ───────────────────────────────────────────────────────────
  api:
    command: "pnpm --filter @ibatexas/api dev"
    depends_on:
      commerce:
        condition: process_healthy
      build-packages:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: "localhost"
        port: 3001
        path: "/health"
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 5
      failure_threshold: 20
    availability:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  # ── Web cache cleanup (one-shot) ────────────────────────────────────────────
  web-clean:
    command: "rm -rf apps/web/.next"
    depends_on:
      build-packages:
        condition: process_completed_successfully
    availability:
      restart: "no"

  # ── Web (Next.js storefront) ────────────────────────────────────────────────
  web:
    command: "pnpm --filter @ibatexas/web dev"
    depends_on:
      web-clean:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: "localhost"
        port: 3000
        path: "/"
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 5
      failure_threshold: 20
    availability:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  # ── Admin (Next.js panel) ───────────────────────────────────────────────────
  admin:
    command: "pnpm --filter @ibatexas/admin dev"
    depends_on:
      admin-clean:
        condition: process_completed_successfully
      build-packages:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: "localhost"
        port: 3002
        path: "/"
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 5
      failure_threshold: 20
    availability:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  # ── QA Viewer (Vite — journeys/graphs/run-explorer) ─────────────────────────
  # Same-repo static viewer (:3010). Reads committed artifacts; RunControls
  # optionally drive `ibx` runs via the dev-gated /internal/qa/* API routes.
  qa-viewer:
    command: "pnpm --filter @ibatexas/qa-viewer dev"
    depends_on:
      build-packages:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: "localhost"
        port: 3010
        path: "/"
      initial_delay_seconds: 3
      period_seconds: 3
      timeout_seconds: 5
      failure_threshold: 20
    availability:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  # ── Adjudicate Operator Console (Next.js, cross-repo) ────────────────────────
  # Lives in ../adjudicate; reads ibatexas's SAME Postgres + Redis (injected
  # env) so every DB-backed route shows real audit/decisions/agents data.
  adj-console:
    command: "pnpm --filter @adjudicate/console dev"
    working_dir: "../adjudicate"
    environment:
      - "DATABASE_URL=${DATABASE_URL}"
      - "REDIS_URL=${REDIS_URL}"
      - "EMERGENCY_REDIS_KEY=${EMERGENCY_REDIS_KEY}"
    depends_on:
      infra:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: "localhost"
        port: 5180
        path: "/"
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 5
      failure_threshold: 30
    availability:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  # ── Adjutant Operator Console (Next.js, cross-repo) ──────────────────────────
  # Lives in ../adjudicate (package @adjudicate/adjutant-console); same injected
  # env so it's ready for P4 incident/proposal projection over the shared DB.
  adjutant:
    command: "pnpm --filter @adjudicate/adjutant-console dev"
    working_dir: "../adjudicate"
    environment:
      - "DATABASE_URL=${DATABASE_URL}"
      - "REDIS_URL=${REDIS_URL}"
      - "EMERGENCY_REDIS_KEY=${EMERGENCY_REDIS_KEY}"
    depends_on:
      infra:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: "localhost"
        port: 5182
        path: "/"
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 5
      failure_threshold: 30
    availability:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  # ── ngrok tunnel (disabled by default) ──────────────────────────────────────
  tunnel:
    command: 'if [ -n "$NGROK_DOMAIN" ]; then exec ngrok http 3001 --url "$NGROK_DOMAIN"; else exec ngrok http 3001; fi'
    depends_on:
      api:
        condition: process_healthy
    availability:
      restart: "no"
    shutdown:
      signal: 15
      timeout_seconds: 5

  # ── Stripe webhook listener ─────────────────────────────────────────────────
  stripe:
    command: "stripe listen --forward-to localhost:3001/api/webhooks/stripe"
    depends_on:
      api:
        condition: process_healthy
    availability:
      restart: "no"
    shutdown:
      signal: 15
      timeout_seconds: 5
