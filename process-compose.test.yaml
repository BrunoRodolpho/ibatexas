version: "0.5"

# process-compose.test.yaml — T1a-11b app-boot test profile (journey-test stack).
#
# Boots ONLY @ibatexas/api (:3001) + commerce/Medusa (:9000) against the
# T1a-11a ephemeral infra (docker-compose.test.yml — bring it up FIRST), with a
# `seed-promotions` one-shot between them (BKL-263 — LE2-018's boot gate).
# web/admin are deliberately excluded until T2-7 needs them. Medusa is NOT
# containerized (plan-v2 §5: explicitly not undertaken) — it boots here as a
# process, mirroring the dev profile (process-compose.yaml).
#
# ENV CONTRACT (T1a-11a, .env.test): the full env block must be present BEFORE
# process boot — the apps load no dotenv of their own, so every process must
# inherit the test values from the moment it starts. (FE-D26 made @ibatexas/
# tools read stack-targeting env — MEDUSA_URL, APP_ENV via rk() — at CALL time
# rather than module load, closing the import-order trap for out-of-process
# tooling; the sourcing contract below is still how the apps get their env.)
# Two layers guarantee that:
#   1. Each app command sources ./.env.test with `set -a` and only then execs
#      the dev server. Sourcing OVERRIDES inherited values, so even if a dev
#      .env leaked into the environment, the test contract wins.
#   2. The canonical launcher (scripts/test-stack-up.sh) passes `-e .env.test`,
#      which REPLACES process-compose's default env-file list ([.env]).
# WARNING: a top-level `env_file:` key is silently IGNORED by process-compose
# (verified on v1.103.0) and `process-compose up` auto-loads the DEV .env via
# its `-e` default — never rely on either; the in-command sourcing above is the
# binding mechanism. Run from the repo root (paths are relative).
#
# T1a-13 trace events: .env.test carries IBX_EVENTS=json + IBX_EVENTS_FILE
# (test profile ONLY), injected into the api process by the same in-command
# sourcing — the api's TelemetryPort re-emits each Conductor turn's token
# usage as a JSONL `llm.call {source:"sut"}` event to stderr AND appends it to
# IBX_EVENTS_FILE, where `ibx journey run` reads the SUT side of its cost
# report. No yaml-level env block is needed (per the WARNING above, none
# would bind).
#
# Canonical lifecycle (counted, timed steps — scripts/test-stack-up.sh):
#   [1] docker compose --env-file .env.test -f docker-compose.test.yml -p <proj> up -d --wait
#   [2] ibx db provision && ibx bootstrap --skip-docker --skip-seed
#       (kernel audit-postgres incl. intent_audit partitions + claustrum,
#       then Medusa + Prisma domain + admin user — all against the test DB;
#       provision must run FIRST: see scripts/test-stack-up.sh)
#   [3] process-compose up -f process-compose.test.yaml -e .env.test -D -p <pc-port>
#   [4] ibx db reindex && ibx test seed
# Teardown: scripts/test-stack-down.sh (process-compose down + compose down -v).

environment:
  - "FORCE_COLOR=1"

log_level: info

processes:
  # ── Package build (one-shot — mirrors the dev profile) ─────────────────────
  # Rebuild the two source-edited shared packages so dist/ matches source.
  build-packages:
    command: |
      echo "Cleaning dist caches..." &&
      rm -rf packages/types/dist packages/tools/dist &&
      echo "Building @ibatexas/types..." &&
      cd packages/types && npx tsc --outDir dist && cd ../.. &&
      echo "Building @ibatexas/tools..." &&
      cd packages/tools && npx tsc --outDir dist && cd ../.. &&
      echo "Package build complete"
    availability:
      restart: "no"

  # ── Commerce (Medusa, TEST_COMMERCE_PORT — default :9000) ──────────────────
  # Same command + probe as the dev profile. Gated on build-packages (unlike
  # dev) so a mid-rebuild dist/ can never race the boot in CI. PORT is pinned to
  # TEST_COMMERCE_PORT AFTER sourcing .env.test: Medusa's start command DOES
  # honor the PORT env (verified — inheriting the api's port binds the wrong
  # socket and the stack deadlocks); the dev stack never hits this because the
  # dev .env sets no PORT. FE-D25: the probe port below expands from
  # TEST_COMMERCE_PORT in process-compose's own environment (test-stack-up.sh
  # exports it before `process-compose up`), so it always tracks the bind port.
  commerce:
    command: "test -f .env.test || { echo 'missing .env.test — run ./scripts/gen-env-test.sh' >&2; exit 1; }; set -a && . ./.env.test && set +a && export PORT=\"${TEST_COMMERCE_PORT:-9000}\" && exec pnpm --filter @ibatexas/commerce dev"
    depends_on:
      build-packages:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: "localhost"
        port: ${TEST_COMMERCE_PORT:-9000}
        path: "/health"
      initial_delay_seconds: 10
      period_seconds: 5
      timeout_seconds: 5
      failure_threshold: 60
    availability:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10

  # ── Declared external references (one-shot — BKL-263) ─────────────────────
  # LE2-018 put a refuse-to-start gate on the declared promotion references, and
  # a per-run ephemeral Medusa has none of them: without this step the api dies
  # inside bootstrapClaustrum() before server.listen, and the launcher reports
  # `api (:3001) not ready after 600s` because the port never binds.
  #
  # This is a DEPENDENCY EDGE, not a seed step, which is why it lives here and
  # not in test-stack-up.sh's [4/4] seed phase: process-compose starts `api` the
  # moment `commerce` turns healthy, so anything the launcher ran between those
  # two events would be racing the api's boot. Gating `api` on
  # `process_completed_successfully` makes the ordering structural — the api
  # cannot start until the promotions are in the store. `restart: "no"`: a seed
  # that failed is a fact to report, and a retry loop would just hide it behind
  # the same 600s timeout (test-stack-up.sh dumps this process's log on a
  # readiness failure).
  #
  # Idempotent (find-or-create by exact code), so a warm store is a clean no-op.
  seed-promotions:
    command: "test -f .env.test || { echo 'missing .env.test — run ./scripts/gen-env-test.sh' >&2; exit 1; }; set -a && . ./.env.test && set +a && exec pnpm --filter @ibatexas/commerce db:seed:promotions"
    depends_on:
      commerce:
        condition: process_healthy
      build-packages:
        condition: process_completed_successfully
    availability:
      restart: "no"

  # ── API (Fastify, TEST_API_PORT — default :3001) ───────────────────────────
  # /health is the deep check (Redis/Postgres critical → 503 until both are
  # reachable), so readiness here implies the test infra is actually wired.
  # The testFingerprint field on /health arrives with T1a-10. FE-D25: PORT is
  # derived from TEST_API_PORT (there is no separate PORT var in .env.test), and
  # the probe port below expands from the same var in process-compose's own
  # environment, so the bind port and the probe always agree.
  api:
    command: "test -f .env.test || { echo 'missing .env.test — run ./scripts/gen-env-test.sh' >&2; exit 1; }; set -a && . ./.env.test && set +a && export PORT=\"${TEST_API_PORT:-3001}\" && exec pnpm --filter @ibatexas/api dev"
    depends_on:
      commerce:
        condition: process_healthy
      # BKL-263: the LE2-018 boot gate reconciles the declared promotions
      # against Medusa and refuses the boot on a miss — so they must exist
      # BEFORE this process starts, not merely before the suite runs.
      seed-promotions:
        condition: process_completed_successfully
      build-packages:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: "localhost"
        port: ${TEST_API_PORT:-3001}
        path: "/health"
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 5
      failure_threshold: 40
    availability:
      restart: on_failure
      max_restarts: 3
    shutdown:
      signal: 15
      timeout_seconds: 10
